<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>साथी – छाया</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal:#2CBFB0; --home:#3EC1A0; --mint:#BFEAE0; --grey:#5B6170;
  --blue-bg:#E3F0FD; --yellow-bg:#FAF7BE; --pink-bg:#FDE6E8; --green-bg:#F3FAE8; --cream:#FBFAEE;
  --btn-yellow:#FDD33A; --red:#DD3033; --chip:#E6E9FC;
  --ph:#ECEEF1; --ph-icon:#B7BCC6;
  --t-hero: clamp(30px, 4.3vw, 52px);
  --t-title: clamp(28px, 4vw, 48px);
  --t-xl: clamp(24px, 3vw, 38px);
  --t-l: clamp(20px, 2.3vw, 30px);
  --t-m: clamp(18px, 1.9vw, 25px);
  --t-s: clamp(15px, 1.4vw, 18px);
  --pad-x: clamp(14px, 4vw, 52px);
  --gap: clamp(12px, 2vw, 26px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#fff}
body{min-height:100dvh;font-family:'Mukta',system-ui,sans-serif;color:#111;background:#fff;overflow-x:hidden}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
img{max-width:100%}
.tap{cursor:pointer;transition:transform .12s ease, filter .12s}
.tap:active{transform:scale(.96);filter:brightness(.97)}
.ph{background:var(--ph);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ph-icon);font-size:14px;font-weight:600;overflow:hidden;width:100%;height:100%}
.ph svg{width:34%;max-width:56px;height:auto}
.img{object-fit:cover;display:block;width:100%;height:100%}

/* ---------- page shell ---------- */
.page{min-height:100dvh;max-width:1500px;margin:0 auto;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(14px,3.5vw,40px) var(--pad-x) 0;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;grid-template-areas:"dt title av"}
.dt{grid-area:dt}
.dt .d{font-size:var(--t-s);font-weight:600}
.dt .t{font-size:clamp(30px,3.8vw,46px);font-weight:600;color:var(--grey);line-height:1.05}
.title{grid-area:title;text-align:center;font-size:var(--t-title);font-weight:700;line-height:1.25}
.avatar-sm{grid-area:av;justify-self:end;width:clamp(60px,7.4vw,90px);aspect-ratio:1;border-radius:50%;border:2px solid var(--teal);overflow:hidden;background:#fff;padding:2px;position:relative}
.avatar-sm>*{border-radius:50%}
.avatar-sm img{object-fit:cover;object-position:50% 30%}
.avatar-sm.live::after{content:"";position:absolute;right:4px;bottom:4px;width:14px;height:14px;border-radius:50%;background:#35C759;border:2px solid #fff}
main{padding:clamp(18px,4vh,48px) 0 clamp(16px,3vh,32px);min-width:0}
.bottom{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:12px 0 max(14px, env(safe-area-inset-bottom));background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));z-index:20}
.home .bottom{position:static;background:none}
.back{height:56px;padding:0 20px 0 12px;border-radius:16px;background:#fff;border:1.5px solid #D5EFEA;box-shadow:0 3px 6px rgba(62,193,160,.15);display:flex;align-items:center;gap:10px;color:var(--home);font-size:var(--t-l);font-weight:600}
.back i{width:28px;height:28px;border-radius:50%;background:#48A999;display:flex;align-items:center;justify-content:center}
.homebtn{width:64px;height:64px;display:flex;align-items:center;justify-content:center;margin-left:auto}
.vline{background:var(--teal);width:2px;align-self:stretch}

/* ---------- home ---------- */
.home .top{grid-template-areas:"dt title time"}
.h-date{grid-area:dt;font-size:var(--t-m);font-weight:600;line-height:1.35}
.h-greet{grid-area:title;text-align:center}
.h-greet h1{font-size:var(--t-hero);font-weight:700;line-height:1.2}
.h-greet p{font-size:var(--t-m);color:var(--grey);font-weight:500;margin-top:6px}
.h-time{grid-area:time;justify-self:end;display:flex;align-items:center;gap:10px;font-size:clamp(32px,4vw,48px);font-weight:600;line-height:1}
.h-time svg{width:clamp(30px,3.4vw,42px);height:auto}
.home-grid{display:grid;gap:var(--gap);align-items:center;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr);grid-template-areas:"mem buddy tiles"}
.mem{grid-area:mem;background:var(--cream);border:1px solid #9A9F97;border-radius:22px;padding:clamp(14px,1.6vw,20px);display:flex;flex-direction:column;gap:12px;max-width:380px;width:100%;justify-self:start}
.mem h3{font-size:var(--t-m);font-weight:800;display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.mem .photo{aspect-ratio:1/1.06;border-radius:16px;border:1px solid #333;overflow:hidden}
.mem .cap{font-size:var(--t-m);font-weight:800;text-align:center;padding:8px 0 4px}
.buddy-col{grid-area:buddy;display:flex;flex-direction:column;align-items:center;width:100%}
.tiles{grid-area:tiles;display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2vw,24px);width:100%;max-width:360px;justify-self:end}
.tile{aspect-ratio:163/226;border-radius:18px;box-shadow:0 4px 6px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:var(--t-xl);font-weight:700;line-height:1.1;text-align:center;padding:10px}
.tile svg{width:62%;height:auto;max-width:110px}
.pill{position:relative;z-index:3;margin-top:-17%;width:min(100%,380px);min-height:clamp(88px,10vw,118px);border-radius:60px;background:var(--mint);border:1px solid #333;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px clamp(16px,2.6vw,34px) 10px clamp(26px,4.4vw,55px)}
.pill b{font-size:var(--t-xl);font-weight:700;display:block;line-height:1.05}
.pill span{font-size:var(--t-m);color:var(--grey);font-weight:600}
.spk{width:clamp(56px,5.8vw,68px);aspect-ratio:1;border-radius:50%;background:#fff;border:1px solid #333;display:flex;align-items:center;justify-content:center;flex:none}
.spk svg{width:60%;height:auto}
@media (max-width:1000px){
  .home-grid{grid-template-columns:1fr 1fr;grid-template-areas:"buddy tiles" "mem mem"}
  .mem{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:auto 1fr;column-gap:20px}
  .mem h3{grid-column:1/3}
  .mem .photo{aspect-ratio:4/3}
  .mem .cap{align-self:center;text-align:left;font-size:var(--t-l)}
  .tiles{justify-self:center}
}
@media (max-width:640px){
  .home .top{grid-template-columns:1fr auto;grid-template-areas:"title title" "dt time";row-gap:14px}
  .home-grid{grid-template-columns:1fr;grid-template-areas:"buddy" "tiles" "mem"}
  .tiles{max-width:none}
  .tile{aspect-ratio:1/1}
  .mem{grid-template-columns:1fr;grid-template-rows:auto}
  .mem h3{grid-column:auto}
  .mem .cap{text-align:center}
}

/* ---------- living avatar ---------- */
.buddy{position:relative;width:min(100%,380px);aspect-ratio:640/595;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.buddy .glow{position:absolute;left:8%;right:8%;top:4%;bottom:0;border-radius:50%;opacity:0;transition:opacity .4s, background .4s;filter:blur(18px)}
.buddy[data-state="listening"] .glow{opacity:.55;background:var(--teal);animation:pulse 1.2s ease-in-out infinite}
.buddy[data-state="thinking"] .glow{opacity:.45;background:#FDD33A;animation:pulse 1.8s ease-in-out infinite}
.buddy[data-state="speaking"] .glow{opacity:.35;background:#8FE3D5}
@keyframes pulse{0%,100%{transform:scale(.94)}50%{transform:scale(1.04)}}
/* Siri-style living glow: follows her voice / your voice */
.buddy{--lvl:0}
.buddy .siri{position:absolute;left:4%;right:4%;top:0;bottom:-3%;pointer-events:none;opacity:0;transition:opacity .35s}
.buddy .siri i{position:absolute;inset:0;border-radius:50%;filter:blur(24px);transform:scale(calc(.86 + var(--lvl) * .28));transition:transform .09s linear}
.buddy .siri i:nth-child(1){background:radial-gradient(circle at 30% 40%,#5EE7DF 0,transparent 62%)}
.buddy .siri i:nth-child(2){background:radial-gradient(circle at 70% 35%,#B490CA 0,transparent 60%)}
.buddy .siri i:nth-child(3){background:radial-gradient(circle at 50% 75%,#F78CA0 0,transparent 60%)}
.buddy[data-state="listening"] .siri{opacity:.95}
.buddy[data-state="listening"] .siri i{animation:siriSwirl 3.2s linear infinite}
.buddy[data-state="thinking"] .siri{opacity:.75}
.buddy[data-state="thinking"] .siri i{animation:siriSwirl 1.1s linear infinite;transform:scale(.95)}
.buddy[data-state="speaking"] .siri{opacity:.6}
.buddy[data-state="speaking"] .siri i{animation:siriSwirl 4s linear infinite}
.buddy .siri i:nth-child(2){animation-direction:reverse !important}
@keyframes siriSwirl{from{rotate:0deg}to{rotate:360deg}}
@media (prefers-reduced-motion:reduce){.buddy .siri i{animation:none !important}}
.buddy .rig{position:absolute;inset:0;transform-origin:50% 95%;animation:breathe 4.2s ease-in-out infinite}
.buddy .rig>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-.8%) scale(1.012)}}
.buddy .tilt{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 90%}
.buddy.tilt-l .tilt{transform:rotate(-3deg)}
.buddy.tilt-r .tilt{transform:rotate(3deg)}
.buddy[data-state="listening"] .tilt{transform:rotate(4deg) translateY(-1%)}
.buddy.hop .tilt{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(2%) scale(1.04,.95)}55%{transform:translateY(-7%) scale(.97,1.04)}100%{transform:translateY(0) scale(1)}}
.buddy[data-state="speaking"] .rig{animation:talkbob .42s ease-in-out infinite alternate}
@keyframes talkbob{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(-.6%) rotate(.6deg)}}
.feat{position:absolute;display:none;pointer-events:none}
.feat svg{width:100%;height:100%;display:block;overflow:visible}
.buddy.blink .eye, .buddy.happy .eye{display:block}
.buddy.happy .eye .open-arc{display:none}
.buddy.blink:not(.happy) .eye .happy-arc{display:none}
.buddy[data-mouth="on"] .mouth{display:block}
.bubble{position:absolute;left:50%;bottom:calc(100% - 14%);transform:translate(-50%,8px) scale(.96);width:max-content;max-width:min(440px,120%);background:#fff;border:2px solid #222;border-radius:22px;padding:10px 18px;font-size:var(--t-m);font-weight:600;line-height:1.35;box-shadow:0 6px 16px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;z-index:5;text-align:center}
.bubble::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:#fff;border-right:2px solid #222;border-bottom:2px solid #222;transform:translateX(-50%) rotate(45deg)}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.bubble .you{display:block;color:var(--grey);font-size:var(--t-s);font-weight:600}
.bubble .scroll{max-height:5.6em;overflow:auto}
.dots span{display:inline-block;width:8px;height:8px;margin:0 2px;border-radius:50%;background:#222;animation:dot 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
.typebox{display:flex;gap:8px;margin-top:8px}
.typebox input{flex:1;min-width:0;font:inherit;font-size:var(--t-s);padding:8px 12px;border:1.5px solid #ccc;border-radius:12px}
.typebox button{background:var(--teal);color:#fff;border-radius:12px;padding:0 14px;font-weight:700;font-size:var(--t-s)}
.typelink{margin-top:6px;font-size:var(--t-s);font-weight:700;color:#2a8f84;text-decoration:underline;padding:4px 8px}
.hint{margin-top:10px;font-size:var(--t-s);color:var(--grey);font-weight:600;text-align:center;min-height:1.4em}
.buddy .mic{position:absolute;right:6%;top:40%;width:clamp(44px,4.6vw,56px);aspect-ratio:1;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.18);z-index:4;opacity:0;transform:scale(.6);transition:.25s}
.buddy[data-state="listening"] .mic{opacity:1;transform:scale(1);animation:pulse 1s infinite}

/* ---------- memories ---------- */
.mem-layout{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:clamp(18px,3vw,40px);align-items:start}
.feat-card{background:#E8FAF7;border-radius:16px;box-shadow:0 3px 6px rgba(0,0,0,.08);padding:12px}
.feat-card .photo{aspect-ratio:1/0.9;border-radius:12px;overflow:hidden}
.feat-card p{font-size:var(--t-m);font-weight:800;margin:20px 6px 10px}
.snap{margin-top:16px;width:100%;min-height:56px;border-radius:12px;background:var(--btn-yellow);box-shadow:0 3px 5px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;gap:18px;font-size:var(--t-m);font-weight:700}
.collage-wrap{display:flex;gap:clamp(14px,2vw,26px);max-width:520px}
.collage{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(44px,5.8vw,70px);gap:8px;position:relative}
.collage .g,.gallery .g{border:3px solid var(--teal);border-radius:12px;overflow:hidden}
.collage .faded{opacity:.22;border-color:#DDE}
.collage .more{grid-column:1/4;grid-row:5/7;align-self:center;justify-self:center;z-index:2;min-height:50px;padding:0 26px;border-radius:12px;background:var(--btn-yellow);box-shadow:0 3px 5px rgba(0,0,0,.15);font-size:var(--t-m);font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(100px,14vw,150px),1fr));gap:12px}
.gallery .g{aspect-ratio:1;position:relative}
.gallery .g .me{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
@media (max-width:760px){ .mem-layout{grid-template-columns:1fr} .collage-wrap{max-width:none} .collage-wrap .vline{display:none} }

/* ---------- reminders (Figma Frame 138): four time-of-day cards ---------- */
.title .sub{display:block;font-size:var(--t-s);font-weight:500;color:#555;margin-top:2px}
.rem-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,2.2vw,28px);align-items:stretch}
.rem{position:relative;min-height:clamp(280px,52vh,470px);border-radius:14px;overflow:hidden;padding:clamp(14px,1.8vw,22px);box-shadow:0 3px 6px rgba(0,0,0,.08);display:flex;flex-direction:column}
.rem.morning{background:#FBE870;border:1px solid #E6D158}
.rem.noon{background:linear-gradient(180deg,#B9E4F6 0%,#D9F1FA 55%,#EEF9FC 100%);border:1px solid #CDEBF3}
.rem.evening{background:linear-gradient(180deg,#E4854F 0%,#DC7443 100%);border:1px solid #CF6A3B}
.rem.night{background:linear-gradient(180deg,#0F2133 0%,#132B3F 60%,#193649 100%);color:#fff;border:1px solid #0B1826}
.rem h3{font-size:var(--t-l);font-weight:700;line-height:1.15;position:relative;z-index:2}
.rem .rt{font-size:var(--t-m);font-weight:700;line-height:1.1;margin:2px 0 clamp(14px,2.4vh,24px);position:relative;z-index:2}
.rem .items{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,14px);overflow-y:auto;position:relative;z-index:2;flex:1;min-height:0}
.rem .it{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--t-m);font-weight:600;line-height:1.2;min-height:44px}
.rem .it span:first-child{min-width:0;overflow-wrap:anywhere}
.rem .it.done span:first-child{opacity:.6}
.rem .none{opacity:.55;font-size:var(--t-s);font-weight:600}
.chk{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid #222;flex:none;display:flex;align-items:center;justify-content:center}
.rem.night .chk{border-color:#fff}
.chk svg{display:none}.chk.on svg{display:block}
.deco{position:absolute;border-radius:50%;pointer-events:none}
@media (max-width:900px){ .rem-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .rem{min-height:240px} }
@media (max-width:480px){ .rem-grid{grid-template-columns:1fr} .rem{min-height:180px} }

/* ---------- contacts ---------- */
.contacts-layout{display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,3fr);gap:clamp(16px,3vw,36px)}
.em-h{font-size:var(--t-l);font-weight:600;margin-bottom:16px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:clamp(14px,2.2vw,26px)}
.em-list{display:grid;gap:clamp(14px,2.2vw,26px)}
.cc{border-radius:12px;border:1px solid #C9CCD1;background:#fff;box-shadow:0 3px 4px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 12px 12px;min-height:140px}
.cc .who{display:flex;flex-direction:column;align-items:center;min-width:0}
.cc .who .pic{width:clamp(72px,8vw,100px);aspect-ratio:1;border-radius:50%;overflow:hidden}
.cc .who b{font-size:var(--t-m);font-weight:700;margin-top:2px;text-align:center}
.callchip{width:clamp(56px,6vw,70px);aspect-ratio:1;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.callchip svg{width:55%;height:auto}
@media (max-width:820px){ .contacts-layout{grid-template-columns:1fr} .contacts-layout>.vline{display:none} .em-list{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))} }
@media (max-width:640px){ .cgrid,.em-list{grid-template-columns:1fr 1fr} .cc{flex-direction:column;justify-content:center;gap:10px;padding:14px 8px} }

/* ---------- calls ---------- */
.call-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:clamp(8px,2vh,18px)}
.bigphoto{width:min(300px,62vw,36vh);aspect-ratio:1;border-radius:50%;overflow:hidden;flex:none}
.cname{font-size:var(--t-hero);font-weight:700;line-height:1.2}
.cstat{font-size:var(--t-xl);font-weight:600;min-height:1.3em}
.round{border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.12);flex:none}
.round svg{width:56%;height:auto}
.round.red{background:var(--red)}.round.green{background:var(--teal)}
.round.md{width:clamp(110px,12vw,144px);aspect-ratio:1}
.round.lg{width:clamp(120px,15vw,180px);aspect-ratio:1}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ringing{animation:ring 1.2s ease-in-out infinite}
.incoming{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"acc mid dec";align-items:end;gap:20px}
.incoming .mid{grid-area:mid;display:flex;flex-direction:column;align-items:center;gap:12px}
.incoming .acc{grid-area:acc;justify-self:center;margin-bottom:-30px}
.incoming .dec{grid-area:dec;justify-self:center;margin-bottom:-30px}
@media (max-width:700px){ .incoming{grid-template-columns:1fr 1fr;grid-template-areas:"mid mid" "acc dec";row-gap:28px} .incoming .acc,.incoming .dec{margin:0} }
.video-stage{position:relative;width:min(100%,960px);aspect-ratio:16/10;max-height:calc(100vh - 440px);min-height:220px;background:#111;border-radius:24px;overflow:hidden}
.video-stage video{width:100%;height:100%;object-fit:cover;background:#111}
.video-stage .local{position:absolute;right:14px;bottom:14px;width:24%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;border:3px solid #fff;background:#333}
.video-stage .local video{transform:scaleX(-1)}
.video-stage .vwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--t-l);font-weight:700;background:rgba(0,0,0,.35);pointer-events:none}
.video-stage .calldbg{position:absolute;left:10px;bottom:10px;max-width:60%;white-space:pre-wrap;font:12px/1.35 monospace;color:#0f0;background:#000c;padding:6px 8px;border-radius:8px;pointer-events:none}
.video-stage .label{position:absolute;left:18px;top:14px;color:#fff;font-size:var(--t-l);font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.6)}

/* ---------- music ---------- */
.music-layout{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(20px,6vw,130px);align-items:center}
.np{position:relative;border:4px solid #D8CFCF;border-radius:28px;background:#fff;box-shadow:0 6px 8px rgba(0,0,0,.1);padding:20px 20px 26px;display:flex;flex-direction:column;align-items:center;text-align:center}
.vinyl{position:relative;width:min(62%,240px);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#111 0 2px,#222 2px 4px);box-shadow:0 0 0 2px #000 inset}
.vinyl .lbl{position:absolute;inset:17%;border-radius:50%;overflow:hidden}
.vinyl.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.np .heart{position:absolute;right:18px;top:18px}
.np .heart svg{width:clamp(40px,4.6vw,58px);height:auto}
.np .art{font-size:clamp(26px,3.2vw,40px);font-weight:700;line-height:1.1;margin-top:24px}
.np .song{font-size:var(--t-l);font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctrls{display:flex;justify-content:center;gap:clamp(30px,4vw,48px);align-items:center;margin-top:16px}
.ctrls button{min-width:56px;min-height:56px;display:flex;align-items:center;justify-content:center}
.pls{display:flex;flex-direction:column;gap:clamp(16px,3vh,36px);max-width:440px;width:100%}
.pl{min-height:clamp(96px,11vw,128px);border-radius:14px;background:#fff;border:1px solid #E6E6E6;box-shadow:0 3px 5px rgba(0,0,0,.12);display:flex;align-items:center;padding:12px 22px 12px 18px;gap:clamp(16px,2.6vw,30px)}
.pl .ic{width:clamp(70px,7.5vw,88px);aspect-ratio:1;border-radius:8px;background:#FDF8E6;display:flex;align-items:center;justify-content:center;flex:none}
.pl .ic svg{width:78%;height:auto}
.pl .tx{flex:1;min-width:0}
.pl .tx b{font-size:var(--t-xl);font-weight:700;display:block;line-height:1.2}
.pl .tx span{font-size:var(--t-s);font-weight:700;color:var(--grey)}
@media (max-width:820px){ .music-layout{grid-template-columns:1fr;justify-items:center} .np{width:min(100%,440px)} }
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));column-gap:clamp(20px,8vw,130px);row-gap:clamp(14px,2.4vw,24px)}
.sg{min-height:108px;border-radius:14px;background:#fff;border:1px solid #E6E6E6;box-shadow:0 3px 5px rgba(0,0,0,.12);display:flex;align-items:center;padding:10px clamp(16px,2.4vw,30px) 10px 14px;gap:clamp(16px,3vw,34px)}
.sg .pic{width:clamp(64px,7vw,84px);aspect-ratio:1;border-radius:50%;overflow:hidden;flex:none}
.sg b{flex:1;font-size:var(--t-m);font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sg svg{flex:none;width:clamp(40px,4.6vw,56px);height:auto}
.sg.on{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal)}
.sg .new{font-size:12px;background:var(--teal);color:#fff;border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:middle}

/* persistent YouTube mini-player (survives screen changes) */
#ytDock{position:fixed;left:50%;bottom:max(12px, env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:#fff;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:8px;display:none;align-items:center;gap:10px;width:min(560px,94vw)}
#ytDock.show{display:flex}
#ytDock .vid{width:200px;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000;flex:none}
#ytDock .vid iframe,#ytDock .vid>div{width:100%;height:100%}
#ytDock .meta{flex:1;min-width:0;font-weight:700;font-size:var(--t-s);line-height:1.3}
#ytDock .meta b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#ytDock button{width:52px;height:52px;border-radius:50%;background:#F2F3F5;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width:760px){ #ytDock{bottom:calc(84px + env(safe-area-inset-bottom))} }
@media (max-width:520px){ #ytDock .vid{width:128px} }

/* ---------- camera ---------- */
.cam{display:flex;flex-direction:column;align-items:center;gap:24px}
.camwrap{position:relative;width:min(100%,820px);aspect-ratio:16/10;max-height:58vh;border-radius:24px;overflow:hidden;background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-size:var(--t-l);text-align:center}
.camwrap video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(120px,22vw,260px);font-weight:800;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.5);pointer-events:none}
.countdown span{animation:pop .9s ease-out}
@keyframes pop{from{transform:scale(1.6);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:.9}}
.shutter{width:96px;height:96px;border-radius:50%;background:var(--btn-yellow);border:6px solid #fff;box-shadow:0 0 0 3px var(--btn-yellow),0 4px 10px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(255,255,255,.96);animation:fade .25s}
.start-card{text-align:center;max-width:560px}
.start-card img{width:min(260px,60vw);display:block;margin:0 auto 18px}
.start-card h2{font-size:var(--t-hero);font-weight:800;line-height:1.2}
.start-card p{font-size:var(--t-m);color:var(--grey);margin:10px 0 26px}
.bigbtn{min-height:76px;padding:0 44px;border-radius:40px;background:var(--teal);color:#fff;font-size:var(--t-xl);font-weight:800;box-shadow:0 8px 20px rgba(44,191,176,.35)}
.med-card{background:#fff;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:clamp(20px,4vw,40px);max-width:640px;width:100%;text-align:center;border:3px solid var(--mint)}
.med-card .pillicon{font-size:64px;line-height:1}
.med-card h2{font-size:var(--t-xl);font-weight:800;margin:10px 0 6px}
.med-card p{font-size:var(--t-m);color:var(--grey)}
.med-card .row{display:flex;gap:16px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.med-card .yes{background:#35C759;color:#fff}
.med-card .no{background:#F2F3F5;color:#111}
.med-card .row button{min-height:76px;min-width:200px;border-radius:24px;font-size:var(--t-l);font-weight:800}
.photo-pop{background:#fff;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.2);padding:16px;max-width:760px;width:100%;text-align:center}
.photo-pop img{width:100%;max-height:62vh;object-fit:contain;border-radius:18px;background:#f4f4f4}
.photo-pop h2{font-size:var(--t-l);font-weight:800;margin:12px 0 4px}
.photo-pop .row{display:flex;gap:14px;justify-content:center;margin-top:12px}
.photo-pop .row button{min-height:60px;padding:0 26px;border-radius:30px;font-size:var(--t-m);font-weight:800;background:#F2F3F5}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(40px);background:#222;color:#fff;font-size:var(--t-m);font-weight:600;padding:12px 28px;border-radius:30px;opacity:0;transition:.3s;pointer-events:none;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){ .page:not(.home) .top{grid-template-columns:1fr auto;grid-template-areas:"dt av" "title title";row-gap:6px} .back{height:52px} }
/* ---------- call log + hardware ---------- */
.clog{display:flex;flex-direction:column;gap:12px;max-width:900px;margin:0 auto}
.cl{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid #E3E5E8;border-radius:16px;padding:12px 18px;box-shadow:0 3px 6px rgba(0,0,0,.06);min-height:84px}
.cl .ic{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#E3F0FD;flex:none}
.cl .ic svg{width:55%;height:auto}
.cl.miss .ic{background:#FDE6E8}
.cl .pic{width:54px;height:54px;border-radius:50%;overflow:hidden;flex:none}
.cl .nm{flex:1;min-width:0;font-size:var(--t-l);font-weight:700;line-height:1.2}
.cl .nm small{display:block;font-size:var(--t-s);color:var(--grey);font-weight:600}
.cl.miss .nm small{color:#DD3033}
.cl .tm{font-size:var(--t-s);color:var(--grey);font-weight:700;text-align:right;white-space:nowrap}
.cl .again{width:56px;height:56px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;flex:none}
.cl .again svg{width:55%;height:auto}
.hwchip{height:48px;padding:0 16px;border-radius:24px;background:#F2F3F5;font-size:var(--t-s);font-weight:700;display:flex;align-items:center;gap:6px}
.hwchip.on{background:#E1F7EE;color:#1F8A5B}
.start-card .hwbtn{display:block;margin:16px auto 0;font-size:var(--t-s);font-weight:700;color:#2a8f84;text-decoration:underline}
.overlay[data-overlay="box"]{align-items:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:12px}
.boxset{text-align:left;max-width:600px;margin-bottom:24px}
.boxset h2{text-align:center}
.boxset .st{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-s);padding:10px 0;border-bottom:1px solid #eee}
.boxset .st b{font-weight:800}
.boxset .ok{color:#1F8A5B}.boxset .bad{color:#C0392B}
.boxset label{display:block;font-size:var(--t-s);font-weight:700;margin:14px 0 6px}
.boxset input{width:100%;box-sizing:border-box;font:inherit;font-size:var(--t-m);padding:12px 14px;border:2px solid #ddd;border-radius:14px}
.boxset .pw{display:flex;gap:8px}.boxset .pw button{padding:0 14px;border-radius:14px;background:#F2F3F5;font-size:var(--t-s)}
.boxset .note{font-size:15px;color:var(--grey);margin-top:6px}
.boxset .row button{min-width:150px;min-height:60px;font-size:var(--t-m)}
#volHud{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border-radius:30px;padding:12px 22px;display:flex;align-items:center;gap:14px;z-index:90;opacity:0;transition:opacity .2s;font-weight:700;font-size:var(--t-m);pointer-events:none}
#volHud.show{opacity:1}
#volHud .bar{width:min(220px,40vw);height:10px;background:#555;border-radius:6px;overflow:hidden}
#volHud .bar i{display:block;height:100%;background:var(--teal)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>

/* ====================== Supabase / API ====================== */
const SB = (() => {
  let client = null;
  try {
    if (window.supabase && CONFIG.supabase.url && CONFIG.supabase.anonKey) {
      client = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey, { auth: { persistSession: false } });
    }
  } catch (e) { console.warn("supabase init failed", e); }
  return client;
})();
const RID = CONFIG.supabase.recipientId;
const FN_URL = `${CONFIG.supabase.url}/functions/v1/${CONFIG.supabase.voiceFunction}`;

const API = {
  /** POST multipart to chhaya-voice. onLine(obj) receives NDJSON lines when stream=true. */
  live: new Set(),
  /** Stops every request in flight (the cut button / watchdog). */
  abortAll() { this.live.forEach((c) => { try { c.abort(); } catch (e) {} }); this.live.clear(); },
  async voice(fields, opts = {}) {
    // Every request has a time limit, so a stalled network can never freeze Chhaya.
    const ctl = new AbortController(); this.live.add(ctl);
    const limit = opts.timeoutMs || (fields.mode === "wake_check" ? 12000 : opts.stream ? 20000 : 25000);
    let timer = setTimeout(() => ctl.abort(), limit);
    const kick = () => { clearTimeout(timer); timer = setTimeout(() => ctl.abort(), 15000); };   // streaming: 15 s without data = dead
    const t0 = performance.now(), tag = fields.mode || (opts.audio ? "question(audio)" : "question");
    try { const r = await this._voice(fields, opts, ctl.signal, kick); Diag.add(`${tag} ${Math.round(performance.now() - t0)}ms ok${r && r.wake !== undefined ? " wake=" + r.wake : ""}${r && r.transcript ? " “" + r.transcript + "”" : ""}${r && r.videoId ? " video=" + r.videoId : ""}${r && r.error ? " error=" + r.error : ""}`); return r; }
    catch (e) { Diag.add(`${tag} ${Math.round(performance.now() - t0)}ms FAILED ${e.name === "AbortError" ? "timeout" : e.message}`); throw e; }
    finally { clearTimeout(timer); this.live.delete(ctl); }
  },
  async _voice(fields, { audio = null, image = null, stream = false, onLine = null } = {}, signal, kick) {
    const fd = new FormData();
    fd.append("recipientId", RID);
    if (!("language" in fields)) fd.append("language", state.lang);
    if (state.sessionId) fd.append("sessionId", state.sessionId);
    if (CONFIG.voice && !("voice" in fields)) fd.append("voice", CONFIG.voice);
    for (const [k, v] of Object.entries(fields)) if (v !== undefined && v !== null) fd.append(k, typeof v === "object" ? JSON.stringify(v) : String(v));
    if (audio) fd.append("audio", audio, "speech." + (audio.type.includes("mp4") ? "mp4" : "webm"));
    if (image) fd.append("image", image, "photo.jpg");
    if (stream) fd.append("stream", "1");
    const res = await fetch(FN_URL, { method: "POST", body: fd, signal, headers: { Authorization: `Bearer ${CONFIG.supabase.anonKey}`, apikey: CONFIG.supabase.anonKey } });
    const ctype = res.headers.get("content-type") || "";
    if (stream && ctype.includes("ndjson") && res.body) {
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = ""; let last = null;
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        kick();
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (!line) continue; try { const o = JSON.parse(line); last = o; onLine && onLine(o); } catch (e) {} }
      }
      if (buf.trim()) { try { const o = JSON.parse(buf); last = o; onLine && onLine(o); } catch (e) {} }
      return last || {};
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok && !data.status) throw Object.assign(new Error(data.error || "HTTP " + res.status), { data });
    if (data.sessionId) state.sessionId = data.sessionId;
    return data;
  },
};

/* ====================== data (from Supabase) ====================== */
const Data = {
  async loadAll() {
    if (!SB) return;
    await Promise.all([this.loadRecipient(), this.loadContacts(), this.loadPhotos(), this.loadReminders(), this.loadSchedule(), this.loadTracks()]);
    state.online = true;
  },
  async loadRecipient() {
    const { data } = await SB.from("care_recipients").select("name, greeting_name, spoken_language").eq("id", RID).maybeSingle();
    if (data) { state.userName = data.greeting_name || data.name || CONFIG.userName; if (data.spoken_language) setLang(data.spoken_language); }
  },
  async loadContacts() {
    const { data, error } = await SB.from("contacts").select("id, name, relation, phone_number, photo_url, is_emergency").eq("user_id", RID).order("created_at");
    if (!error && data) { state.contacts = data; rerender(["contacts", "home"]); }
  },
  async loadPhotos() {
    const { data, error } = await SB.from("photos").select("id, image_url, message, sender_contact_id, source, sent_at, liked").eq("user_id", RID).order("sent_at", { ascending: false }).limit(60);
    if (!error && data) { state.photos = data; rerender(["memories", "home"]); }
  },
  async loadReminders() {
    const start = new Date(); start.setHours(0, 0, 0, 0); const end = new Date(start); end.setDate(end.getDate() + 1);
    const { data, error } = await SB.from("reminders").select("id, label, remind_at, type, status, response, requires_confirmation")
      .eq("user_id", RID).gte("remind_at", start.toISOString()).lt("remind_at", end.toISOString()).order("remind_at");
    if (!error && data) { state.reminders = data; rerender(["reminders", "home"]); Native.scheduleReminders(data); }
  },
  // The guardian's onboarding routine: one row per slot (type morning / lunch /
  // evening / night) with the time it happens today.
  async loadSchedule() {
    const d = new Date(); const today = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const { data, error } = await SB.from("schedule_items").select("id, label, type, scheduled_time, done, date").eq("user_id", RID).eq("date", today).order("scheduled_time");
    if (error) { console.warn("[Chhaya] couldn't load today's routine:", error); return; }
    state.schedule = data || []; rerender(["reminders"]);
  },
  async loadTracks() {
    const { data, error } = await SB.from("music_tracks").select("id, title, artist, category, youtube_video_id, play_count, last_played_at, created_at").eq("user_id", RID).order("last_played_at", { ascending: false, nullsFirst: false });
    if (!error && data) { state.tracks = data; rerender(["music", "playlist"]); }
  },
};
function rerender(names) { const cur = (location.hash.slice(1) || "home").split("/")[0]; if (names.includes(cur) && !Assistant.busy) render(); }
function setLang(l) { if (l === "hi" || l === "mr") { state.lang = l; store.set("lang", l); } }

/* ====================== routing ====================== */
let hist = [];
function go(hash) { if (hash === location.hash) { render(); return; } hist.push(location.hash || "#home"); location.hash = hash; }
function back() { const prev = hist.pop() || "#home"; if (prev === location.hash) render(); else location.hash = prev; }
window.addEventListener("hashchange", render);

/* ====================== derived data ====================== */
function nextMedicine() {
  const t = Date.now();
  return state.reminders.find((r) => r.type === "medicine" && r.status !== "done" && Date.parse(r.remind_at) >= t - 30 * 60000);
}
function memoryOfDay() {
  const p = state.photos.find((x) => x.source !== "recipient") || state.photos[0];
  return p ? { src: p.image_url, caption: p.message || CONFIG.memoryCaption } : { src: CONFIG.images.memoryOfDay, caption: CONFIG.memoryCaption };
}
function playlists() {
  const cat = (c) => state.tracks.filter((t) => t.category === c && t.youtube_video_id);
  const bh = cat("bhajans").map((t) => ({ title: t.title, videoId: t.youtube_video_id, trackId: t.id, isNew: isRecent(t) }));
  const known = new Set(bh.map((b) => b.title));
  CONFIG.bhajans.forEach((title) => { if (!known.has(title)) bh.push({ title, videoId: null }); });
  return [
    { id: "bhajans", name: "भजन", icon: "dholak", songs: bh },
    { id: "my_songs", name: "मेरे गाने", icon: "note", songs: cat("my_songs").map((t) => ({ title: t.title, videoId: t.youtube_video_id, trackId: t.id, isNew: isRecent(t) })) },
    { id: "old_favourites", name: "पुराने पसंदीदा", icon: "radio", songs: cat("old_favourites").map((t) => ({ title: t.title, videoId: t.youtube_video_id, trackId: t.id })) },
  ];
}
function isRecent(t) { return Date.now() - Date.parse(t.created_at || 0) < 24 * 3600 * 1000; }

  reminders() {
    // Frame 138: four fixed cards. Every reminder the guardian (or Chhaya)
    // sets for today lands in the card whose time window it falls in.
    const slots = [
      { key: "morning", title: "सुबह की दवा", def: "09:00", test: (h) => h >= 4 && h < 12 },
      { key: "noon", title: "दोपहर का खाना", def: "13:00", routine: "lunch", test: (h) => h >= 12 && h < 16 },
      { key: "evening", title: "शाम की सैर", def: "18:00", test: (h) => h >= 16 && h < 20 },
      { key: "night", title: "रात की दवाई", def: "20:00", test: (h) => h >= 20 || h < 4 },
    ];
    const routineTypes = ["morning", "lunch", "evening", "night"];

/* =====================================================================
   BUDDY — avatar visuals (blink, breathe, tilt, hop, mouth, bubble)
   ===================================================================== */
const Buddy = (() => {

    timers.push(setTimeout(function b() { blink(); if (Math.random() < 0.2) setTimeout(blink, 260); timers.push(setTimeout(b, 2600 + Math.random() * 3200)); }, 2000));
    timers.push(setTimeout(function t() {
      if (el && curState === "idle") { const c = Math.random() < 0.5 ? "tilt-l" : "tilt-r"; el.classList.add(c); setTimeout(() => el && el.classList.remove(c), 1400); }
      timers.push(setTimeout(t, 6000 + Math.random() * 6000));
    }, 5000));
  }
  function blink() { if (!el || el.classList.contains("happy")) return; el.classList.add("blink"); setTimeout(() => el && el.classList.remove("blink"), 150); }
  function happy(ms = 900) { if (!el) return; el.classList.add("happy"); setTimeout(() => el && el.classList.remove("happy"), ms); }

    const h = $("#hint"); if (h) h.textContent = s === "idle" ? Wake.hint() : { listening: "बोलिए, मैं सुन रही हूँ…", thinking: "सोच रही हूँ…", speaking: "रोकने के लिए छुएं" }[s] || "";
  }
  function bubble(html) { lastBubble = html || ""; const b = $("#bubble"); if (!b) return; if (!html) { b.classList.remove("show"); return; } b.innerHTML = html; b.classList.add("show"); }
  function drawMouth(open) {
    const p = $("#mpath"); if (!p) return;
    const o = Math.max(0, Math.min(1, open)), top = 20, w = 30 + o * 6, low = top + 8 + o * 62;
    const d = `M${50 - w} ${top} Q50 ${top + 6 + o * 4} ${50 + w} ${top} Q${50 + w * 0.7} ${low} 50 ${low} Q${50 - w * 0.7} ${low} ${50 - w} ${top} Z`;
    p.setAttribute("d", d); $("#mclipPath").setAttribute("d", d);
    const t = $("#tongue"); t.setAttribute("cy", low - 4); t.setAttribute("ry", 4 + o * 12);

      if (!isPlaying()) { stopMouth(); return; }

      cur += (Math.min(1, Math.sqrt(s / buf.length) * 5) - cur) * 0.4; drawMouth(cur);

  return {
    attach(node) { el = node; drawMouth(0); el.dataset.state = curState; if (lastBubble) bubble(lastBubble); el.addEventListener("click", (e) => { if (e.target.closest("#typebox,[data-type]")) return; e.stopPropagation(); hop(); Assistant.onTap(); }); schedule(); },
    detach() { timers.forEach(clearTimeout); timers = []; stopMouth(); el = null; },

})();

/* =====================================================================
   VOICE — plays server audio (Maya) through one <audio> element with an
   analyser so the avatar's mouth follows the real voice.
   ===================================================================== */
const Voice = (() => {
  let el = null, ctx = null, analyser = null, cancelToken = 0, curDone = null;
  function ensure() {
    if (el) return;
    el = new Audio(); el.preload = "auto"; el.volume = state.volume;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaElementSource(el); analyser = ctx.createAnalyser(); analyser.fftSize = 512;
      src.connect(analyser); analyser.connect(ctx.destination);
    } catch (e) { console.warn("audio analyser unavailable", e); }
  }
  function play(b64, mime) {
    ensure(); const my = cancelToken;
    return new Promise((resolve) => {
      if (!b64) return resolve();
      try { ctx && ctx.resume(); } catch (e) {}
      const url = URL.createObjectURL(b64ToBlob(b64, mime));
      let fin = false, guard = null;
      const done = () => { if (fin) return; fin = true; clearTimeout(guard); if (curDone === done) curDone = null; URL.revokeObjectURL(url); Buddy.stopMouth(); resolve(); };
      curDone = done;   // Voice.stop() finishes this promise too (a paused <audio> never fires "ended")
      el.onended = done; el.onerror = done; el.src = url;
      guard = setTimeout(done, 30000);
      el.onloadedmetadata = () => { if (isFinite(el.duration) && el.duration > 0) { clearTimeout(guard); guard = setTimeout(done, (el.duration / (CONFIG.voiceStyle?.pitch || 1)) * 1000 + 4000); } };
      const P = CONFIG.voiceStyle?.pitch || 1; el.preservesPitch = false; el.mozPreservesPitch = false; el.webkitPreservesPitch = false; el.playbackRate = P;
      el.play().then(() => { if (my !== cancelToken) { el.pause(); return done(); } if (analyser) Buddy.mouthFromAnalyser(analyser, () => !el.paused && !el.ended); }).catch(done);
    });
  }
  /* Streamed speech: raw 16-bit PCM (24 kHz) arriving in small pieces from Maya's socket,
     scheduled back-to-back on the Web Audio clock so there are no gaps. */
  let pcmGain = null, pcmT = 0, pcmSources = [], pcmToken = -1, pcmMouth = false;
  function pcmPush(b64) {
    ensure(); if (!ctx) return;
    if (pcmToken !== cancelToken) { pcmToken = cancelToken; pcmT = 0; }
    if (!pcmGain) { pcmGain = ctx.createGain(); pcmGain.connect(analyser || ctx.destination); }
    pcmGain.gain.value = state.volume;
    try { ctx.resume(); } catch (e) {}
    const bin = atob(b64); const n = bin.length >> 1; if (!n) return;
    const buf = ctx.createBuffer(1, n, 24000); const ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) { let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); if (v >= 32768) v -= 65536; ch[i] = v / 32768; }
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(pcmGain);
    const P = CONFIG.voiceStyle?.pitch || 1; src.playbackRate.value = P;   // little-girl voice
    const now = ctx.currentTime;
    if (pcmT < now + 0.03) pcmT = now + (pcmSources.length ? 0.06 : 0.15); // small cushion against network jitter
    src.start(pcmT); pcmT += buf.duration / P;
    pcmSources.push(src); src.onended = () => { pcmSources = pcmSources.filter((x) => x !== src); };
    if (!pcmMouth && analyser) { pcmMouth = true; Buddy.mouthFromAnalyser(analyser, () => { const on = ctx.currentTime < pcmT + 0.05 && pcmToken === cancelToken; if (!on) pcmMouth = false; return on; }); }
  }
  function pcmDone() {
    const my = cancelToken;
    // Wall-clock deadline too: if iOS pauses the audio clock, currentTime stops moving.
    const deadline = performance.now() + Math.min(90000, Math.max(0, ctx ? (pcmT - ctx.currentTime) * 1000 : 0) + 4000);
    return new Promise((resolve) => {
      const tick = () => {
        if (my !== cancelToken || !ctx || ctx.currentTime >= pcmT || performance.now() > deadline) return resolve();
        if (ctx.state !== "running") { try { ctx.resume(); } catch (e) {} }
        setTimeout(tick, Math.min(250, Math.max(30, (pcmT - ctx.currentTime) * 1000)));
      };
      tick();
    });
  }
  return {
    ensure, get ctx() { ensure(); return ctx; },
    wake() { ensure(); if (ctx && ctx.state !== "running") { try { ctx.resume(); } catch (e) {} } },
    async say(b64, mime, text) { if (text) Buddy.bubble(`<div class="scroll">${esc(text)}</div>`); Buddy.setState("speaking"); await play(b64, mime); },
    pcm(b64) { pcmPush(b64); },
    pcmDone,
    get playing() { return !!el && !el.paused && !el.ended; },
    get streaming() { return !!ctx && pcmToken === cancelToken && ctx.currentTime < pcmT; },
    setVolume(v) { ensure(); el.volume = v; if (pcmGain) pcmGain.gain.value = v; },
    stop() { cancelToken++; if (el) { el.pause(); try { el.currentTime = 0; } catch (e) {} } if (curDone) curDone(); pcmSources.forEach((x) => { try { x.stop(); } catch (e) {} }); pcmSources = []; pcmT = 0; Buddy.stopMouth(); },
    beep(freq = 880, ms = 160) { ensure(); if (!ctx) return; const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = freq; g.gain.value = 0.15 * state.volume; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + ms / 1000); },
  };
})();

/* =====================================================================
   SOUNDS — Siri-style earcons and alert tones, synthesised (no files).
   listen / heard / error, reminder bell, "done" chime, confirm, call ring
   (incoming) and ring-back (outgoing, Indian style).
   ===================================================================== */
const Sounds = (() => {
  function out() { const ctx = Voice.ctx; const g = ctx.createGain(); g.gain.value = Math.max(0.05, state.volume); g.connect(ctx.destination); return { ctx, g }; }
  function note(freq, at, dur, { type = "sine", vol = 0.22, attack = 0.012, glide = 0, harm = 0 } = {}) {
    try {
      const { ctx, g } = out(); const t = ctx.currentTime + at;
      const o = ctx.createOscillator(), e = ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t); if (glide) o.frequency.exponentialRampToValueAtTime(freq * glide, t + dur);
      e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(vol, t + attack); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(e); e.connect(g); o.start(t); o.stop(t + dur + 0.05);
      if (harm) { const o2 = ctx.createOscillator(), e2 = ctx.createGain(); o2.type = "sine"; o2.frequency.setValueAtTime(freq * 2.01, t);
        e2.gain.setValueAtTime(0.0001, t); e2.gain.exponentialRampToValueAtTime(vol * harm, t + attack); e2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.6);
        o2.connect(e2); e2.connect(g); o2.start(t); o2.stop(t + dur); }
    } catch (e) {}
  }
  const api = {
    listen() { note(740, 0, 0.16, { vol: 0.16, glide: 1.5 }); note(1175, 0.11, 0.22, { vol: 0.14 }); },          // "I'm listening"
    heard() { note(1047, 0, 0.14, { vol: 0.11, glide: 0.7 }); },                                                    // got it
    error() { note(392, 0, 0.18, { type: "triangle", vol: 0.16 }); note(311, 0.17, 0.26, { type: "triangle", vol: 0.14 }); },
    confirm() { note(880, 0, 0.14, { vol: 0.15 }); note(1319, 0.1, 0.3, { vol: 0.14, harm: 0.3 }); },
    reminder() { [1047, 1319, 1568, 1319, 1568, 2093].forEach((f, i) => note(f, i * 0.2 + (i > 2 ? 0.35 : 0), 1.1, { vol: 0.2, harm: 0.35 })); },
    /** A little-girl giggle after a joke: quick bubbly notes bouncing up and down. */
    giggle() { [1568, 1976, 1760, 2093, 1865, 2349].forEach((f, i) => note(f, i * 0.075, 0.09, { type: "triangle", vol: 0.12, glide: i % 2 ? 0.85 : 1.12 })); },
    done() { [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.09, 0.5, { vol: 0.18, harm: 0.3 })); note(2093, 0.4, 0.9, { vol: 0.1, harm: 0.5 }); },
    /** Incoming call: a warm marimba-like tune, repeating until stop(). Stays quiet while Chhaya is speaking. */
    ring() {
      let on = true;
      const play = () => { if (!on) return; if (Buddy.state !== "speaking") [1319, 1568, 1976, 1568, 1319, 1976].forEach((f, i) => note(f, i * 0.16, 0.45, { type: "sine", vol: 0.24, harm: 0.4 })); };
      play(); const t = setInterval(play, 2400);
      return () => { on = false; clearInterval(t); };
    },
    /** Outgoing call: Indian ring-back (400 Hz, double burst). */
    ringback() {
      let on = true;
      const play = () => { if (!on) return; [0, 0.6].forEach((at) => { note(400, at, 0.4, { vol: 0.07, attack: 0.02 }); note(450, at, 0.4, { vol: 0.05, attack: 0.02 }); }); };

})();

/* =====================================================================
   MIC + RECORDER — one mic stream (asked once on the start screen) and a
   recorder with voice-activity detection (stops after a pause).
   ===================================================================== */
const Mic = {
  stream: null,
  // Inside the iPad app the web microphone delivered no usable speech, so the app records natively.
  get native() { return Native.available; },
  alive() { if (this.native) return true; const s = this.stream; return !!s && s.active !== false && s.getAudioTracks().some((t) => t.readyState === "live"); },
  async init() {
    if (this.native) return null;
    // iPad kills the microphone when the screen sleeps or another app/call takes it: get a fresh one.
    if (this.alive()) return this.stream;
    try { this.stream && this.stream.getTracks().forEach((t) => t.stop()); } catch (e) {}
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    this.stream.getAudioTracks().forEach((t) => { t.onended = () => { if (this.stream && !this.alive()) this.stream = null; }; });
    return this.stream;
  },
  _active: null,
  noise: 0.006,   // running estimate of the room's background level
  apple: /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1),
  /**
   * Records one utterance. Waits patiently: people often pause after the first
   * words, so a short start needs a longer pause before she stops listening.
   */

/* =====================================================================
   ASSISTANT — one conversation turn at a time.
   ===================================================================== */
const Assistant = {
  busy: false,
  cancelled: false,
  /** Hardware "cut" button: stop talking/listening and drop the rest of this turn. */
  cancel() { if (!this.busy) return false; this.cancelled = true; Voice.stop(); Mic.cancel(); API.abortAll(); Buddy.setState("idle"); Buddy.bubble(""); return true; },
  /** Button pressed while she's busy: stop what she's doing and start listening fresh. */

  /** Last resort: something hung — drop the turn and free her up. */

/* =====================================================================
   ACK — her instant "जी, बोलिए?" after the wake word (fetched once per
   language and kept in memory, so there's no wait).
   ===================================================================== */
const Ack = {
  cache: {},
  async load(lang = state.lang) {
    if (this.cache[lang] || !SB) return;
    try { const r = await API.voice({ mode: "wake_ack", language: lang }); if (r.audioBase64) this.cache[lang] = r; } catch (e) {}
  },
  async play() {
    const r = this.cache[state.lang] || this.cache.hi;
    if (!r) { this.load(); return; }         // not loaded yet: just the chime this time
    Buddy.setState("speaking");
    await Voice.say(r.audioBase64, r.audioMime, r.reply);
  },
};

/* =====================================================================
