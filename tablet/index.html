      try {
        rec = new SR(); rec.lang = state.lang === "mr" ? "mr-IN" : "hi-IN"; rec.interimResults = true; rec.continuous = true;
        rec.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; if (t.trim() && Buddy.state === "listening") Buddy.bubble(`<span class="you">आप:</span> ${esc(t.trim())}`); };
        rec.onerror = () => {}; rec.start();
      } catch (e) { rec = null; }
    },
    stop() { try { rec && rec.abort(); } catch (e) {} rec = null; },
  };
})();

/* =====================================================================
   REMINDERS (non-medicine) — bell, a card with "हो गया / बाद में", she says
   it aloud and listens for "हो गया". Done -> success chime.
   ===================================================================== */
const Reminders = {
  alerted: store.get("remAlerted", {}),
  start() { setInterval(() => this.tick(), FAST ? 3000 : 20000); setTimeout(() => this.tick(), 4000); },
  due() {
    const t = Date.now();
    return state.reminders.filter((r) => r.type !== "medicine" && r.status !== "done" && Date.parse(r.remind_at) <= t && Date.parse(r.remind_at) > t - 2 * 3600e3 && this.alerted[r.id] !== r.remind_at);
  },
  async tick() {
    if (!state.started || !SB || Assistant.busy || Calls.inCall() || Calls.incomingCall) return;
    const r = this.due()[0]; if (!r) return;
    this.alerted[r.id] = r.remind_at; store.set("remAlerted", this.alerted);
    this.showCard(r); Sounds.reminder(); await sleep(1900);
    await Assistant.exclusive(async () => {
      if (location.hash && !location.hash.startsWith("#home")) go("#home");
      const lang = state.lang;
      const text = lang === "mr" ? `आठवण: ${r.label}. झालं की सांगा, "हो झालं".` : `याद दिला रही हूँ: ${r.label}। हो जाए तो बताइए, "हो गया"।`;
      const say = await API.voice({ mode: "say", text, language: lang }).catch(() => null);
      if (say && say.audioBase64) await Voice.say(say.audioBase64, say.audioMime, say.reply);
      Buddy.setState("listening"); Buddy.bubble(`<span class="you">"हो गया" या "बाद में" बोलिए…</span>${DOTS}`);
      Sounds.listen(); await sleep(300);
      const blob = await Mic.record({ maxMs: 7000, noSpeechMs: 7000 });
      if (!blob) return;
      Buddy.setState("thinking");
      const res = await API.voice({ mode: "reminder_reply", reminderId: r.id }, { audio: blob }).catch(() => null);
      if (!res) return;
      if (res.status === "taken") { this.closeCard(); Sounds.done(); await sleep(600); }
      else if (res.status === "not_taken") this.closeCard();
      if (res.audioBase64) await Voice.say(res.audioBase64, res.audioMime, res.reply);
      Data.loadReminders();
    });
  },
  showCard(r) {
    $("#overlay").innerHTML = `<div class="overlay" data-overlay="rem"><div class="med-card">
      <div class="pillicon">⏰</div><h2>${esc(r.label)}</h2><p>${timeHi(r.remind_at)}</p>
      <div class="row"><button class="yes tap" data-act="remDone" data-id="${r.id}">हो गया ✅</button><button class="no tap" data-act="remSnooze" data-id="${r.id}">10 मिनट बाद</button></div>
    </div></div>`;
  },
  closeCard() { const o = document.querySelector('[data-overlay="rem"]'); if (o) o.remove(); },
  async done(id) {
    this.closeCard(); Assistant.cancel(); Sounds.done();
    if (SB) await SB.from("reminders").update({ status: "done", confirmed_at: new Date().toISOString() }).eq("id", id);
    Data.loadReminders();
  },
  async snooze(id) {
    this.closeCard(); Assistant.cancel(); Sounds.confirm();
    if (SB) await SB.from("reminders").update({ status: "snoozed", remind_at: new Date(Date.now() + 10 * 60e3).toISOString() }).eq("id", id);
    Data.loadReminders();
  },
};

/* =====================================================================
   MEDICINE — due -> (+10m) "did you take it?" -> (+3m) "your daughter is
   asking…" -> (+10m) no reply: guardian notified. Yes/no is sent to the
   backend, which notifies the guardian (push).
   ===================================================================== */
const Medicine = {
  stages: store.get("medStages", {}),
  save() { store.set("medStages", this.stages); },
  start() { this.tick(); setInterval(() => this.tick(), FAST ? 3000 : 20000); },
  active() {
    const t = Date.now();
    return state.reminders.filter((r) => r.type === "medicine" && r.status !== "done" && !r.response && Date.parse(r.remind_at) <= t && Date.parse(r.remind_at) > t - 3 * 3600e3);
  },
  async tick() {
    if (!state.started || !SB) return;
    await Data.loadReminders();
    const T = CONFIG.medicine;
    for (const r of this.active()) {
      if (Assistant.busy || Calls.inCall()) return;
      const st = this.stages[r.id] || { stage: "new", at: 0 };
      const since = Date.now() - st.at;
      if (st.stage === "new") await this.run(r, "due");
      else if (st.stage === "due" && since >= T.askAfterMin * MIN) await this.run(r, "ask");
      else if (st.stage === "ask" && since >= T.guardianAfterMin * MIN) await this.run(r, "guardian_asks");
      else if (st.stage === "guardian_asks" && since >= T.giveUpAfterMin * MIN) {
        this.stages[r.id] = { stage: "gave_up", at: Date.now() }; this.save(); this.closeCard();
        await API.voice({ mode: "medicine_no_response", reminderId: r.id }).catch(() => {});
        Data.loadReminders();
      }
    }
  },
  async run(r, stage) {
    this.stages[r.id] = { stage, at: Date.now() }; this.save();
    this.showCard(r);
    Sounds.reminder(); await sleep(1900);
    await Assistant.exclusive(async () => {
      if (location.hash && !location.hash.startsWith("#home")) go("#home");
      await Assistant.speakServer({ mode: "medicine_alarm", stage, reminderId: r.id, label: r.label });
      await this.listenForAnswer(r, 2);
    });
  },
  async listenForAnswer(r, tries) {
    Buddy.setState("listening"); Buddy.bubble(`<span class="you">हाँ या नहीं बोलिए…</span>${DOTS}`);
    const blob = await Mic.record({ maxMs: 7000, noSpeechMs: 7000 });
    if (!blob) return;
    Buddy.setState("thinking");
    const res = await API.voice({ mode: "medicine_reply", reminderId: r.id }, { audio: blob });
    await Voice.say(res.audioBase64, res.audioMime, res.reply);
    if (res.status === "taken" || res.status === "not_taken") this.finish(r, res.status);
    else if (tries > 1) await this.listenForAnswer(r, tries - 1);
  },
  async answerByTap(id, taken) {
    const r = state.reminders.find((x) => x.id === id); if (!r) return this.closeCard();
    this.closeCard();
    await Assistant.exclusive(async () => {
      const res = await API.voice({ mode: "medicine_reply", reminderId: id, text: taken ? "हाँ, ले ली" : "नहीं, अभी नहीं ली" });
      await Voice.say(res.audioBase64, res.audioMime, res.reply);
      this.finish(r, res.status);
    });
  },
  finish(r, status) { if (status === "taken") Sounds.done(); this.stages[r.id] = { stage: status, at: Date.now() }; this.save(); this.closeCard(); Data.loadReminders(); },
  showCard(r) {
    $("#overlay").innerHTML = `<div class="overlay" data-overlay="med"><div class="med-card">
      <div class="pillicon">💊</div><h2>दवा का समय: ${esc(r.label)}</h2><p>${timeHi(r.remind_at)}</p>
      <div class="row"><button class="yes tap" data-act="medYes" data-id="${r.id}">हाँ, ले ली ✅</button><button class="no tap" data-act="medNo" data-id="${r.id}">अभी नहीं</button></div>
    </div></div>`;
  },
  closeCard() { const o = document.querySelector('[data-overlay="med"]'); if (o) o.remove(); },
};

/* =====================================================================
   ANNOUNCEMENTS — guardian sent a photo / is video calling (Realtime).
   ===================================================================== */
const Announce = {
  async photo(p) {
    if (p.source === "recipient") return; // her own photos
    state.photos.unshift(p);
    $("#overlay").innerHTML = `<div class="overlay" data-overlay="photo"><div class="photo-pop">
      <img src="${esc(p.image_url)}" alt=""><h2>नई फ़ोटो आई है ❤️</h2>${p.message ? `<p>${esc(p.message)}</p>` : ""}
      <div class="row"><button class="tap" data-act="likePhoto" data-id="${p.id}">${I.heart(false, 26)} पसंद है</button><button class="tap" data-act="closeOverlay">बंद करें</button></div></div></div>`;
    setTimeout(() => { const o = document.querySelector('[data-overlay="photo"]'); if (o) o.remove(); }, 45000);
    await Assistant.exclusive(async () => { await Assistant.speakServer({ mode: "announce", event: "photo_received", photoId: p.id }); });
  },
};

/* =====================================================================
   REALTIME — live updates from Supabase
   ===================================================================== */
const Realtime = {
  start() {
    if (!SB) return;
    const f = (col) => `${col}=eq.${RID}`;
    SB.channel("chhaya-tablet-" + RID)
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "photos", filter: f("user_id") }, (p) => Announce.photo(p.new))
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "call_requests", filter: f("recipient_id") }, (p) => { const c = p.new; if (c.call_type === "video" && c.direction === "incoming") { Calls.log("incoming row " + c.id); Calls.onIncoming(c); } })
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "call_requests", filter: f("recipient_id") }, (p) => Calls.onRowUpdate(p.new))
      .on("postgres_changes", { event: "*", schema: "public", table: "music_tracks", filter: f("user_id") }, () => Data.loadTracks())
      .on("postgres_changes", { event: "*", schema: "public", table: "reminders", filter: f("user_id") }, () => Data.loadReminders())
      .on("postgres_changes", { event: "*", schema: "public", table: "schedule_items", filter: f("user_id") }, () => Data.loadSchedule())
      .on("postgres_changes", { event: "*", schema: "public", table: "contacts", filter: f("user_id") }, () => Data.loadContacts())
      .subscribe();
    // The guardian app also rings over this broadcast channel. Database
    // permissions can hide a guardian's call_requests row from this tablet
    // (it uses the public key); broadcast reaches it either way.
    Calls.ringChannel = SB.channel("chhaya-ring-" + RID, { config: { broadcast: { self: false } } })
      .on("broadcast", { event: "signal" }, ({ payload }) => Calls.onRing(payload))
      .subscribe((st) => console.log("[Chhaya call] ring channel:", st));
  },
};

/* =====================================================================
   CALLS — WebRTC video calls with the guardian app. Signalling goes over a
   Supabase Realtime broadcast channel "chhaya-call-<callId>".
   Protocol: callee sends {ready} -> caller sends {offer} -> callee {answer};
   both send {ice}; either sends {hangup}.
   ===================================================================== */
const Calls = {
  current: null, incomingCall: null, pc: null, channel: null, localStream: null, remoteStream: null, timer: null, ring: null,
  inCall() { return !!this.current; },
  stopRing() { if (typeof this.ring === "function") this.ring(); this.ring = null; },
  stopRingback() { if (typeof this.ringback === "function") this.ringback(); this.ringback = null; },
  statusText() {
    const c = this.current; if (!c) return "";
    return { ringing: "घंटी जा रही है…", connecting: "जुड़ रहा है…", connected: "बात हो रही है", ended: "कॉल ख़त्म", missed: "किसी ने नहीं उठाया" }[c.state] || "";
  },
  setState(s) {
    if (!this.current) return; this.current.state = s; this.log("state " + s);
    if (s !== "ringing") this.stopRingback();
    const el = $("#cstat"); if (el) el.textContent = this.statusText();
    if (s === "connecting" || s === "connected") {
      // Picked up: open the camera view straight away; the other person's video fills in once connected.
      const st = $("#videoStage"), intro = $("#callIntro"), wait = $("#videoWait");
      if (st) st.style.display = ""; if (intro) intro.style.display = "none";
      if (wait) wait.style.display = s === "connected" ? "none" : "";
      this.bindVideo();
    }
  },
  dbg: [],
  log(msg) {
    console.log("[Chhaya call]", msg);
    this.dbg.push(new Date().toLocaleTimeString("en-GB") + " " + msg); if (this.dbg.length > 12) this.dbg.shift();
    const d = document.getElementById("callDbg"); if (d) d.textContent = this.dbg.join("\n");
  },
  // Wait (max 2.5 s) for ICE gathering so the offer/answer already carries the
  // network addresses. Then the call no longer depends on dozens of separate
  // "ice" messages all arriving over Realtime.
  waitIce(pc, ms = 2500) {
    if (pc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((res) => {
      const t = setTimeout(done, ms);
      function done() { clearTimeout(t); pc.removeEventListener("icegatheringstatechange", chk); res(); }
      function chk() { if (pc.iceGatheringState === "complete") done(); }
      pc.addEventListener("icegatheringstatechange", chk);
    });
  },
  bindVideo() { const r = $("#remoteVideo"), l = $("#localVideo"); if (r && this.remoteStream && r.srcObject !== this.remoteStream) r.srcObject = this.remoteStream; if (r) r.volume = state.volume; if (l && this.localStream && l.srcObject !== this.localStream) l.srcObject = this.localStream; },
  async media() { if (!this.localStream) this.localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 } }, audio: { echoCancellation: true, noiseSuppression: true } }); return this.localStream; },
  makePC(callId) {
    const pc = new RTCPeerConnection({ iceServers: CONFIG.iceServers });
    this.remoteStream = new MediaStream();
    pc.ontrack = (e) => { e.streams[0].getTracks().forEach((t) => this.remoteStream.addTrack(t)); this.bindVideo(); };
    pc._sdpSent = false;
    pc.onicecandidate = (e) => { if (e.candidate && pc._sdpSent) this.send({ type: "ice", candidate: e.candidate }); };
    pc.oniceconnectionstatechange = () => this.log("ice " + pc.iceConnectionState);
    pc.onconnectionstatechange = () => { this.log("connection " + pc.connectionState); if (pc.connectionState === "connected") this.setState("connected"); if (pc.connectionState === "failed") setTimeout(() => { if (this.pc === pc && pc.connectionState !== "connected") this.end(true); }, 3000); else if (pc.connectionState === "disconnected") setTimeout(() => { if (this.pc === pc && pc.connectionState !== "connected") this.end(true); }, 12000); };
    this.localStream.getTracks().forEach((t) => pc.addTrack(t, this.localStream));
    this.pc = pc; return pc;
  },
  send(msg) { this.channel && this.channel.send({ type: "broadcast", event: "signal", payload: { ...msg, from: "tablet" } }); },
  join(callId, onSignal) {
    return new Promise((resolve) => {
      this.channel = SB.channel("chhaya-call-" + callId, { config: { broadcast: { self: false } } });
      this.channel.on("broadcast", { event: "signal" }, ({ payload }) => { if (payload.from !== "tablet") onSignal(payload); });
      this.channel.subscribe((s) => { if (s === "SUBSCRIBED") resolve(); });
    });
  },
  /** Tablet calls a guardian (from voice or a contact card). */
  async startOutgoing({ callId, name, photo }) {
    if (!SB || !callId) return;
    Wake.pause(); Music.duck(true);
    this.dbg = []; this.handled.add(callId); this.current = { id: callId, name, photo, state: "ringing", role: "caller" };
    this.sendRing("ring", callId);
    clearInterval(this.ringRepeat);
    this.ringRepeat = setInterval(() => { if (this.current && this.current.id === callId && this.current.state === "ringing") this.sendRing("ring", callId); else clearInterval(this.ringRepeat); }, 3000);
    go("#call/" + callId);
    this.stopRingback(); this.ringback = Sounds.ringback();
    try { await this.media(); } catch (e) { toast("कैमरा/माइक चालू नहीं हो पाया"); return this.end(false); }
    this.bindVideo();
    await this.join(callId, async (m) => {
      if (m.type === "ready" && this.pc) {
        // The guardian is still asking, so our offer (or its answer) was lost: send it again.
        if (this.pc._sdpSent && this.pc.signalingState === "have-local-offer") { this.send({ type: "offer", sdp: this.pc.localDescription }); this.log("offer resent"); }
      } else if (m.type === "ready" && !this.pc) {
        this.log("ready received");
        this.setState("connecting");
        try {
          const pc = this.makePC(callId); const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
          await this.waitIce(pc);
          this.send({ type: "offer", sdp: pc.localDescription }); pc._sdpSent = true; this.log("offer sent");
        } catch (e) { this.log("offer failed: " + e.message); console.error(e); }
      } else if (m.type === "answer" && this.pc) {
        this.log("answer received");
        try { if (this.pc.signalingState === "have-local-offer") await this.pc.setRemoteDescription(m.sdp); } catch (e) { this.log("answer failed: " + e.message); console.error(e); }
      }
      else if (m.type === "ice" && this.pc) { try { await this.pc.addIceCandidate(m.candidate); } catch (e) {} }
      else if (m.type === "hangup" || m.type === "decline") { this.end(false, m.type === "decline" ? "declined" : null); }
    });
    clearTimeout(this.timer);
    this.timer = setTimeout(async () => {
      if (this.current && this.current.id === callId && this.current.state === "ringing") {
        this.setState("missed");
        await API.voice({ mode: "call_missed", callId }).catch(() => {});
        setTimeout(() => this.end(false), 2500);
      }
    }, 45000);
  },
  async startFromContact(contactId) {
    const c = state.contacts.find((x) => x.id === contactId);
    if (!SB) return toast("अभी कॉल नहीं हो सकती (ऑफ़लाइन)");
    try {
      const r = await API.voice({ mode: "start_call", contactId });
      if (!r.callId) throw new Error(r.error || "no call");
      this.startOutgoing({ callId: r.callId, name: c?.name || r.contact, photo: c?.photo_url });
    } catch (e) { console.error(e); toast("कॉल शुरू नहीं हो पाई"); }
  },
  /** A guardian is calling the tablet. */
  ringChannel: null, handled: new Set(), ringRepeat: null,
  sendRing(type, callId) {
    if (!this.ringChannel) return;
    this.ringChannel.send({ type: "broadcast", event: "signal", payload: { type, callId, from: "tablet" } });
    this.log("ring channel: sent " + type);
  },
  onRing(p) {
    if (!p || p.from === "tablet") return;
    this.log("ring channel: received " + p.type);
    if (p.type === "ring" && p.callId) this.onIncoming({ id: p.callId, callerName: p.name });
    else if (p.type === "cancel" && this.incomingCall && this.incomingCall.id === p.callId) {
      clearTimeout(this.timer); this.stopRing(); Voice.stop(); this.incomingCall = null; Wake.resume(); Music.duck(false); back();
    }
  },
  async onIncoming(row) {
    if (this.current || this.incomingCall || this.handled.has(row.id)) return;
    this.handled.add(row.id); this.dbg = []; this.log("ringing for call " + row.id);
    this.incomingCall = { id: row.id, name: row.callerName || "", photo: "" };
    Wake.pause(); Music.duck(true);
    go("#incoming/" + row.id);
    this.stopRing(); this.ring = Sounds.ring();
    API.voice({ mode: "announce", event: "video_call_incoming", callId: row.id }).then((r) => {
      if (r.callerName) { this.incomingCall && (this.incomingCall.name = r.callerName); const el = document.querySelector(".incoming .cname"); if (el) el.textContent = r.callerName; }
      if (this.incomingCall) Voice.say(r.audioBase64, r.audioMime, r.reply);
    }).catch(() => {});
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { if (this.incomingCall && this.incomingCall.id === row.id) this.decline("missed"); }, 45000);
  },
  async accept() {
    const inc = this.incomingCall; if (!inc) return;
    this.stopRing(); clearTimeout(this.timer); Voice.stop();
    this.incomingCall = null;
    this.dbg = []; this.current = { id: inc.id, name: inc.name, photo: inc.photo, state: "connecting", role: "callee" };
    location.replace("#call/" + inc.id);
    try { await this.media(); } catch (e) { toast("कैमरा/माइक चालू नहीं हो पाया"); return this.end(true); }
    this.bindVideo();
    await SB.from("call_requests").update({ status: "connected", answered_at: new Date().toISOString() }).eq("id", inc.id);
    await this.join(inc.id, async (m) => {
      if (m.type === "offer") {
        this.log("offer received");
        if (this.pc) {
          if (this.pc._sdpSent && this.pc.localDescription && this.pc.localDescription.type === "answer") { this.send({ type: "answer", sdp: this.pc.localDescription }); this.log("answer resent"); }
          return;
        }
        try {
          const pc = this.makePC(inc.id);
          await pc.setRemoteDescription(m.sdp); const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
          await this.waitIce(pc);
          this.send({ type: "answer", sdp: pc.localDescription }); pc._sdpSent = true; this.log("answer sent");
        } catch (e) { this.log("answer failed: " + e.message); console.error(e); }
      } else if (m.type === "ice" && this.pc) { try { await this.pc.addIceCandidate(m.candidate); } catch (e) {} }
      else if (m.type === "hangup") this.end(false);
    });
    this.send({ type: "ready" }); this.log("ready sent");
    let tries = 0; clearInterval(this.readyRepeat);
    this.readyRepeat = setInterval(() => {
      const ok = this.pc && this.pc.connectionState === "connected";
      if (ok || !this.current || this.current.id !== inc.id || ++tries > 12) { clearInterval(this.readyRepeat); return; }
      this.send({ type: "ready" });
    }, 2500);
  },
  async decline(status = "declined") {
    const inc = this.incomingCall; if (!inc) return;
    this.stopRing(); clearTimeout(this.timer); Voice.stop();
    this.incomingCall = null;
    if (SB) {
      // call_requests.status only accepts requested/initiated/connected/completed/failed/cancelled,
      // so "declined" is saved as cancelled and "missed" as failed (the call log shows both as missed calls).
      const dbStatus = status === "missed" ? "failed" : "cancelled";
      const { error } = await SB.from("call_requests").update({ status: dbStatus, ended_at: new Date().toISOString() }).eq("id", inc.id);
      if (error) console.warn("[Chhaya] couldn't save the declined call:", error);
      const ch = SB.channel("chhaya-call-" + inc.id); ch.subscribe((s) => { if (s === "SUBSCRIBED") { ch.send({ type: "broadcast", event: "signal", payload: { type: "decline", from: "tablet" } }); setTimeout(() => SB.removeChannel(ch), 1000); } });
    }
    Wake.resume(); Music.duck(false);
    back();
  },
  onRowUpdate(row) {
    if (this.current && row.id === this.current.id && ["completed", "declined", "cancelled", "missed", "failed"].includes(row.status) && this.current.state !== "ended") this.end(false);
    if (this.incomingCall && row.id === this.incomingCall.id && ["cancelled", "completed", "missed", "failed"].includes(row.status)) { this.stopRing(); this.incomingCall = null; Wake.resume(); Music.duck(false); back(); }
  },
  async end(sendHangup = true, reason = null) {
    const c = this.current; if (!c) return;
    const wasRinging = c.state === "ringing" && c.role === "caller";
    c.state = "ended"; clearTimeout(this.timer); clearInterval(this.ringRepeat); clearInterval(this.readyRepeat); this.stopRingback();
    if (wasRinging) this.sendRing("cancel", c.id);  // guardian isn't on the call channel yet
    if (sendHangup) this.send({ type: "hangup" });
    if (SB && sendHangup) await SB.from("call_requests").update({ status: "completed", ended_at: new Date().toISOString() }).eq("id", c.id);
    try { this.pc && this.pc.close(); } catch (e) {}
    this.pc = null;
    if (this.channel) { setTimeout((ch) => SB.removeChannel(ch), 800, this.channel); this.channel = null; }
    if (this.localStream) { this.localStream.getTracks().forEach((t) => t.stop()); this.localStream = null; }
    this.remoteStream = null; this.current = null;
    if (reason === "declined") toast("अभी फ़ोन नहीं उठा पाए");
    Wake.resume(); Music.duck(false);
    go("#home");
  },
};

/* =====================================================================
   MUSIC — YouTube IFrame player in a dock that survives screen changes.
   ===================================================================== */
const Music = {
  player: null, ready: null, current: null, playing: false, queue: [], ducked: false,
  load() {
    if (this.ready) return this.ready;
    this.ready = new Promise((resolve) => {
      window.onYouTubeIframeAPIReady = () => {
        this.player = new YT.Player("ytPlayer", {
          // origin + widget_referrer tell YouTube which site embeds it (missing = "Error 153" in apps)
          width: "100%", height: "100%", playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, enablejsapi: 1, origin: location.origin, widget_referrer: location.href },
          events: { onReady: () => resolve(this.player), onStateChange: (e) => this.onState(e.data),
            // 2 bad id, 5 player error, 100 removed, 101/150 embedding not allowed, 153 page origin not accepted
            onError: (e) => { Diag.add("YouTube error " + e.data); if (e.data === 101 || e.data === 150) { toast("यह गाना यहाँ नहीं चल सकता — अगला चला रही हूँ"); this.next(); } else toast("गाना नहीं चल पाया"); } },
        });
      };
      const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
    });
    return this.ready;
  },
  async play(song) {
    this.current = song; $("#ytDock").classList.add("show"); $("#ytTitle").textContent = song.title || ""; $("#ytToggleBtn").innerHTML = I.pause(22);
    const p = await this.load(); p.loadVideoById(song.videoId); p.setVolume(this.vol());
    this.syncUI();
  },
  async playByTitle(title) {
    try {
      toast("गाना ढूँढ रही हूँ…");
      const r = await API.voice({ mode: "music_search", query: title });
      if (r.videoId) { this.play({ videoId: r.videoId, title: r.title, trackId: r.trackId }); Data.loadTracks(); }
      else toast(r.error || "गाना नहीं मिला");
    } catch (e) { toast("गाना नहीं मिल पाया"); }
  },
  onState(s) { this.playing = s === 1; if (s === 0) this.next(); this.syncUI(); },
  toggle() { if (!this.player || !this.current) return; this.playing ? this.player.pauseVideo() : this.player.playVideo(); },
  stop() { if (this.player) this.player.stopVideo(); this.current = null; this.playing = false; $("#ytDock").classList.remove("show"); this.syncUI(); },
  list() { return playlists().flatMap((p) => p.songs); },
  step(dir) {
    const l = this.list(); if (!l.length) return;
    let i = this.current ? l.findIndex((s) => s.videoId === this.current.videoId || s.title === this.current.title) : -1;
    i = (i + dir + l.length) % l.length; const s = l[i];
    s.videoId ? this.play(s) : this.playByTitle(s.title);
  },
  next() { this.step(1); }, prev() { this.step(-1); },
  vol() { return Math.round((this.ducked ? 0.15 : 1) * state.volume * 100); },
  duck(on) { this.ducked = on; this.applyVolume(); },
  applyVolume() { if (this.player && this.current) try { this.player.setVolume(this.vol()); } catch (e) {} },
  syncUI() {
    const b = $("#ytToggleBtn"); if (b) b.innerHTML = this.playing ? I.pause(22) : I.play(22);
    const v = $("#vinyl"); if (v) v.classList.toggle("spin", this.playing);
    const cur = (location.hash.slice(1) || "home").split("/")[0];
    if ((cur === "music" || cur === "playlist") && !Assistant.busy) render();
  },
};

/* =====================================================================
   CAMERA — preview, 3-2-1 countdown, upload to Supabase (guardian notified)

const Camera = {
  stream: null,
  async start() {
    const wrap = $("#camwrap"); if (!wrap) return;
    try {
      if (!Camera.stream) {
        try { Camera.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 1280 } }, audio: false }); }
        catch (e) { Diag.add("camera: " + e.name + " " + (e.message || "")); throw e; }
      }
      if (!$("#camwrap")) return Camera.stop();
      wrap.innerHTML = `<video autoplay playsinline muted></video><div class="countdown" id="countdown"></div>`;
      wrap.querySelector("video").srcObject = Camera.stream;
    } catch (e) {
      wrap.innerHTML = `<div style="padding:40px;line-height:1.5">${I.camera(80, "#888")}<br>कैमरा उपलब्ध नहीं है।<br><span style="font-size:.8em;color:#bbb">कृपया कैमरे की अनुमति दें।</span></div>`;
    }
  },
  stop() { if (Camera.stream) { Camera.stream.getTracks().forEach((t) => t.stop()); Camera.stream = null; } },
  async waitVideo() { for (let i = 0; i < 70; i++) { const v = document.querySelector("#camwrap video"); if (v && v.videoWidth) return v; await sleep(150); } return null; },
  async countdownShot(n = 3) {
    const v = await this.waitVideo(); if (!v) { Diag.add("camera: no picture after 10 s"); toast("कैमरा चालू नहीं है"); return; }
    for (let i = n; i >= 1; i--) { const cd = $("#countdown"); if (cd) cd.innerHTML = `<span>${toDev(i)}</span>`; Voice.beep(i === 1 ? 988 : 784, 180); await sleep(1000); }
    const cd = $("#countdown"); if (cd) cd.innerHTML = "";
    await this.capture(v);
  },
  async capture(v) {
    v = v || document.querySelector("#camwrap video");
    if (!v || !v.videoWidth) { toast("कैमरा चालू नहीं है"); return; }
    const scale = Math.min(1, 1280 / v.videoWidth);
    const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * scale); c.height = Math.round(v.videoHeight * scale);
    const x = c.getContext("2d"); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(v, 0, 0, c.width, c.height);
    const w = $("#camwrap"); w.style.transition = "none"; w.style.filter = "brightness(3)"; setTimeout(() => { w.style.transition = "filter .3s"; w.style.filter = ""; }, 80);
    Voice.beep(1318, 120);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    state.photos.unshift({ image_url: URL.createObjectURL(blob), source: "recipient" });
    if (!SB) { toast("तस्वीर ली गई"); return; }
    try { toast("तस्वीर भेज रही हूँ…"); const up = await API.voice({ mode: "photo_upload" }, { image: blob }); if (up && up.error) throw new Error(up.error); toast("तस्वीर परिवार को भेज दी गई ✓"); Data.loadPhotos(); }
    catch (e) { Diag.add("photo upload failed: " + e.message); toast("तस्वीर भेजी नहीं जा सकी"); }
  },
};

/* =====================================================================
   CALL LOG — recent calls from call_requests
   ===================================================================== */
const CallLog = {
  rows: null,
  async load() {
    if (!SB) { this.rows = []; return this.paint(); }
    const { data, error } = await SB.from("call_requests").select("id, contact_id, direction, status, call_type, requested_at, answered_at, ended_at")
      .eq("recipient_id", RID).order("requested_at", { ascending: false }).limit(40);
    this.rows = error ? [] : data || []; this.paint();
  },
  paint() { const el = $("#clog"); if (el) el.innerHTML = this.html(); },
  html() {
    if (this.rows === null) return `<div class="hint">लोड हो रहा है…</div>`;
    if (!this.rows.length) return `<div class="hint" style="font-size:var(--t-l)">अभी कोई कॉल नहीं</div>`;
    const st = { connected: "बात हुई", completed: "बात हुई", missed: "छूटी हुई कॉल", declined: "काटी गई", cancelled: "रद्द", ringing: "घंटी गई", requested: "कॉल किया", initiated: "कॉल किया", failed: "नहीं लगी" };
    const today = new Date().toDateString();
    return this.rows.map((r) => {
      const c = state.contacts.find((x) => x.id === r.contact_id);
      const incoming = r.direction === "incoming";
      const name = c?.name || (incoming ? "परिवार से" : "फ़ोन");
      const miss = ["missed", "declined", "failed"].includes(r.status);
      const d = new Date(r.requested_at);
      const when = (d.toDateString() === today ? "आज" : `${toDev(d.getDate())} ${MONTHS[d.getMonth()]}`) + ", " + timeHi(r.requested_at).replace(" बजे", "");
      let dur = "";
      if (r.answered_at && r.ended_at) { const s = Math.max(0, Math.round((Date.parse(r.ended_at) - Date.parse(r.answered_at)) / 1000)); dur = ` • ${toDev(Math.floor(s / 60))}:${toDev(String(s % 60).padStart(2, "0"))}`; }
      const kind = r.call_type === "video" ? "वीडियो" : "फ़ोन";
      return `<div class="cl ${miss ? "miss" : ""}">
        ${c?.photo_url ? `<div class="pic">${pic(c.photo_url, "")}</div>` : `<div class="ic">${(r.call_type === "video" ? I.video : I.phone)(miss ? "#DD3033" : "#5AAAF5")}</div>`}
        <div class="nm">${esc(name)}<small>${incoming ? "↙ आई" : "↗ की"} ${kind} कॉल • ${st[r.status] || r.status}${dur}</small></div>
        <div class="tm">${when}</div>
        ${c ? `<button class="again tap" data-act="callBack" data-id="${c.id}" aria-label="फिर से कॉल करें">${I.video("#8A9CF7")}</button>` : ""}
      </div>`;
    }).join("");
  },
};

/* ====================== volume (knob or code) ====================== */
let volHudTimer = null;
function setVolume(v) {
  v = Math.max(0, Math.min(1, v));
  if (Math.abs(v - state.volume) < 0.01) return;
  state.volume = v; store.set("volume", v);
  Voice.setVolume(v); Music.applyVolume();
  const rv = $("#remoteVideo"); if (rv) rv.volume = v;
  const pct = Math.round(v * 100);
  $("#volBar").style.width = pct + "%"; $("#volPct").textContent = toDev(pct) + "%"; $("#volIcon").textContent = pct === 0 ? "🔇" : pct < 40 ? "🔈" : "🔊";
  const hud = $("#volHud"); hud.classList.add("show"); clearTimeout(volHudTimer); volHudTimer = setTimeout(() => hud.classList.remove("show"), 1200);
}

/* =====================================================================
   NATIVE — extras when this page runs inside the Chhaya iPad app (Capacitor).
   In Chrome / Safari none of this exists and everything here is skipped.
   The app's own plugin "ChhayaNative" is called through Capacitor's built-in
   bridge, so the page stays one plain HTML file (no npm packages).
   ===================================================================== */
const Native = (() => {
  const cap = window.Capacitor;
  const has = !!(cap && cap.nativePromise && cap.addListener && cap.isNativePlatform && cap.isNativePlatform() &&
    (cap.PluginHeaders || []).some((h) => h.name === "ChhayaNative"));
  const call = (method, opts) => has ? cap.nativePromise("ChhayaNative", method, opts || {}) : Promise.reject(new Error("not in the app"));
  const on = (event, cb) => has && cap.addListener("ChhayaNative", event, cb);
  const api = {
    available: has, call, on,
    offlineCopy: location.protocol === "capacitor:",   // the copy built into the app (no internet at launch)
    /** Reminders also ring as iPad notifications, so they work when the app is closed or offline. */
    async scheduleReminders(list) {
      if (!has) return;
      const soon = Date.now() + 5000;
      const items = (list || []).filter((r) => r.status !== "done" && Date.parse(r.remind_at) > soon).map((r) => ({
        id: String(r.id), at: Date.parse(r.remind_at), body: r.label || "",
        title: r.type === "medicine" ? "💊 दवा का समय" : "⏰ छाया याद दिला रही है",
      }));
      try { await call("notifySchedule", { items }); } catch (e) { console.warn("[Chhaya] reminder notifications:", e); }
    },
    start() {
      if (!has) return;
      call("notifyPermission").catch(() => {});
      // Offline copy: switch to the live page as soon as the internet is back (never mid-conversation).
      if (api.offlineCopy && CONFIG.app && CONFIG.app.remoteUrl) {
        setInterval(async () => {
          if (Assistant.busy || Calls.inCall() || Calls.incomingCall) return;
          try {
            await fetch(CONFIG.app.remoteUrl + "?ping=" + Date.now(), { mode: "no-cors", cache: "no-store" });
            location.replace(CONFIG.app.remoteUrl + location.search);
          } catch (e) { /* still offline */ }
        }, 20000);
      }
    },
  };
  return api;
})();

/* =====================================================================
   HARDWARE — ESP32 button box. Ways to connect, same messages:
     • Chhaya iPad app: native Bluetooth (Native / ChhayaNative plugin) — v27 box
     • Bluetooth (Web Bluetooth: Bluefy on iPad, Chrome on Mac/PC/Android) — "Chhaya Box" UART
     • USB cable (Web Serial: Chrome/Edge on a computer)
     • WiFi backup: the box broadcasts on Supabase channel chhaya-box-<deviceId>
     • Bluetooth keyboard (older sketch): F13 / F20 / F19 keys
   ESP32 -> page : BTN:TALK | BTN:CALLS | BTN:HANGUP | VOL:0-100 | CHHAYA:READY <fw> | WIFI:<status>
   page -> ESP32 : HELLO | LED:<state> | MAP:<state>=<pattern> | LEDX:<pattern> | WIFI:<name>\t<password> | WIFI?
   ===================================================================== */
const Hardware = (() => {
  const hasSerial = "serial" in navigator;
  const hasBle = !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
  const hasNative = Native.available;
  const supported = hasSerial || hasBle || hasNative;
  const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";      // Nordic UART service
  const NUS_RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";   // page writes here
  const NUS_TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";   // ESP32 notifies here
  const LED_FOR = { idle: "OFF", listening: "GREEN", thinking: "BLUE", speaking: "YELLOW" };
  const enc = new TextEncoder();
  let link = null;              // { kind: "native"|"ble"|"serial", send(line), close() }
  let lastLed = "", buf = "", opening = false;
  const box = { native: "off", fw: "", wifi: "" };   // shown on the Box settings screen

  function feed(text) {
    buf += text;
    let i; while ((i = buf.indexOf("\n")) >= 0) { const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1); if (line) onLine(line); }
    if (buf.length > 200) buf = "";
  }
  function linked(l, how) {
    link = l; lastLed = ""; buf = ""; box.fw = ""; box.wifi = "";
    setTimeout(() => { send("HELLO"); sendPatterns(); api.led(Buddy.state, true); }, l.kind === "serial" ? 1800 : 300);
    toast(`बटन बॉक्स जुड़ गया ✓${how ? " (" + how + ")" : ""}`); rerender(["home"]); BoxSettings.refresh();
  }
  function unlinked(l, silent) {
    if (link !== l) return;
    link = null; rerender(["home"]); BoxSettings.refresh();
    if (!silent) toast("बटन बॉक्स हट गया");
  }
  // The box keeps a copy of the pattern table, so its WiFi backup shows the same patterns.
  function sendPatterns() {
    for (const [st, spec] of Object.entries(CONFIG.ledPatterns || {})) send(`MAP:${st}=${spec}`);
  }

  /* ---------- Chhaya iPad app (native Bluetooth) ---------- */
  let nativeStarted = false, nativeLink = null;
  async function startNative() {
    if (nativeStarted) return; nativeStarted = true;
    Native.on("boxLine", (d) => d && d.line && feed(d.line + "\n"));
    Native.on("boxLog", (d) => d && d.msg && Diag.add("box: " + d.msg));
    Native.on("boxState", (d) => d && onNativeState(d.state));
    try { const s = await Native.call("boxStart"); onNativeState(s.state); } catch (e) { console.warn("[Chhaya] box start", e); nativeStarted = false; }
  }
  function onNativeState(st) {
    box.native = st;
    if (st === "connected") {
      if (link && link === nativeLink) return;
      nativeLink = { kind: "native", send: (line) => Native.call("boxWrite", { line }), close: () => {} };
      linked(nativeLink, "Bluetooth");
    } else if (nativeLink && link === nativeLink) {
      unlinked(nativeLink, true);
      toast("बटन बॉक्स से संपर्क टूटा — पास आते ही अपने आप जुड़ जाएगा");
    }
    BoxSettings.refresh();
  }

  /* ---------- WiFi backup: the box broadcasts presses when the app isn't connected ---------- */
  let lastCloudN = null;
  function startBoxChannel() {
    const id = CONFIG.hardware && CONFIG.hardware.deviceId;
    if (!id || !SB) return;
    SB.channel("chhaya-box-" + id).on("broadcast", { event: "box" }, ({ payload: p }) => {
      if (!p || (p.n != null && p.n === lastCloudN)) return;
      lastCloudN = p.n;
      if (p.btn) press(String(p.btn).toUpperCase(), false);
      else if (typeof p.vol === "number") setVolume(p.vol / 100);
      else if (p.hello) console.log("[Chhaya] button box online over WiFi, firmware", p.fw);
    }).subscribe();
  }
  async function send(line) { if (link) { try { await link.send(line); } catch (e) { console.warn("hardware send failed", e); } } }

  /* ---------- Bluetooth (Web Bluetooth) ---------- */
  async function openBle(device) {
    const dec = new TextDecoder();
    let rx = null, q = Promise.resolve(), alive = true, l = null;
    async function attach() {
      const server = await device.gatt.connect();
      const svc = await server.getPrimaryService(NUS);
      rx = await svc.getCharacteristic(NUS_RX);
      const tx = await svc.getCharacteristic(NUS_TX);
      tx.addEventListener("characteristicvaluechanged", (e) => feed(dec.decode(e.target.value)));
      await tx.startNotifications();
    }
    await attach();
    l = {
      kind: "ble",
      // GATT allows one operation at a time, so writes are queued.
      send: (line) => (q = q.then(() => rx && rx.writeValue(enc.encode(line + "\n"))).catch((e) => console.warn("ble write", e))),
      close: () => { alive = false; try { device.gatt.disconnect(); } catch (e) {} },
    };
    device.addEventListener("gattserverdisconnected", async () => {
      if (!alive) return;
      unlinked(l, true); toast("बटन बॉक्स से संपर्क टूटा — फिर जोड़ रही हूँ…");
      for (let n = 0; alive && n < 40; n++) {           // try again for ~2 minutes
        await sleep(3000);
        try { await attach(); linked(l, "Bluetooth"); return; } catch (e) { /* keep trying */ }
      }
    });
    linked(l, "Bluetooth");
    try { localStorage.setItem("chhaya.hw", "ble"); } catch (e) {}
  }
  async function connectBle() {
    // Show every nearby device: iPads sometimes remember an old name for the ESP32
    // (e.g. "MITRA Back Button") or hide the service in the scan, which made a filtered list empty.
    const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: [NUS] });
    try { await openBle(device); }
    catch (e) {
      try { device.gatt.disconnect(); } catch (x) {}
      const err = new Error("not-chhaya"); err.name = "NotChhaya"; err.deviceName = device.name || ""; err.cause = e; throw err;
    }
  }

  /* ---------- USB cable (Web Serial) ---------- */
  async function openSerial(port) {
    await port.open({ baudRate: 115200 });
    const writer = port.writable.getWriter();
    let reader = null, l = null;
    l = {
      kind: "serial",
      send: (line) => writer.write(enc.encode(line + "\n")),
      close: async () => { try { reader && (await reader.cancel()); } catch (e) {} },
    };
    (async () => {
      const dec = new TextDecoder();
      try { reader = port.readable.getReader(); for (;;) { const { value, done } = await reader.read(); if (done) break; feed(dec.decode(value, { stream: true })); } }
      catch (e) { console.warn("serial read ended", e); }
      finally {
        try { reader && reader.releaseLock(); } catch (e) {}
        try { writer.releaseLock(); } catch (e) {}
        try { await port.close(); } catch (e) {}
        unlinked(l);
      }
    })();
    linked(l, "USB");
    try { localStorage.setItem("chhaya.hw", "serial"); } catch (e) {}
  }

  function onLine(line) {
    if (line.startsWith("BTN:")) press(line.slice(4).trim().toUpperCase(), false);
    else if (line.startsWith("VOL:")) { const n = parseInt(line.slice(4), 10); if (!isNaN(n)) setVolume(n / 100); }
    else if (line.startsWith("WIFI:")) { box.wifi = line.slice(5).trim(); BoxSettings.refresh(); }
    else if (line.startsWith("CHHAYA:READY")) { box.fw = line.slice(12).trim(); api.led(Buddy.state, true); BoxSettings.refresh(); }
  }
  function press(b, fromKey) {
    if (!state.started) {
      // A key press counts as a user gesture, so it may unlock sound; a Bluetooth message does not.
      if (fromKey) return Start.begin();
      toast("पहले स्क्रीन पर “शुरू करें” दबाइए"); return;
    }
    if (b === "TALK") {
      if (Calls.incomingCall) return Calls.accept();          // answer a ringing call
      if (Calls.inCall()) return;
      Voice.wake();
      if (Assistant.busy) return Assistant.interruptAndWake(); // like Siri: press again = stop and listen to me
      Assistant.onWake("");                                    // same as saying "छाया"
    } else if (b === "CALLS") {
      go("#calls");
    } else if (b === "HANGUP") {
      if (Calls.inCall()) return Calls.end(true);
      if (Calls.incomingCall) return Calls.decline();
      if (Assistant.cancel()) return;                         // stop listening/thinking/speaking
      if (Buddy.state === "speaking") return Voice.stop();    // e.g. an announcement
      if (Music.playing) return Music.toggle();
    }
  }

  const api = {
    supported, hasBle, hasSerial, hasNative, box,
    get connected() { return !!link; },
    get kind() { return link && link.kind; },
    /** Must be called from a tap (browsers only open the device picker on a user gesture). */
    async connect() {
      if (!supported) return toast("इस ब्राउज़र में बटन बॉक्स नहीं जुड़ता — iPad पर Bluefy, कंप्यूटर पर Chrome इस्तेमाल करें");
      if (link) return toast("बटन बॉक्स पहले से जुड़ा है — सेटिंग के लिए बटन को देर तक दबाएँ");
      if (hasNative) {
        startNative();
        if (box.native === "unauthorized") return toast("Bluetooth की अनुमति दें: iPad Settings → Chhaya → Bluetooth");
        if (box.native === "bluetooth-off") return toast("iPad का Bluetooth चालू करें");
        return toast("बटन बॉक्स ढूँढ रही हूँ… बॉक्स चालू करके पास रखें");
      }
      if (opening) return; opening = true;
      const useSerial = hasSerial && (!hasBle || QS.get("hw") === "serial");
      try {
        if (useSerial) await openSerial(await navigator.serial.requestPort());
        else await connectBle();
      } catch (e) {
        if (e && e.name === "NotChhaya") {
          console.warn(e.cause);
          toast(`“${e.deviceName || "यह डिवाइस"}” छाया बटन बॉक्स नहीं है — सूची में “Chhaya” वाला चुनें`);
        } else if (e && e.name !== "NotFoundError") {
          console.warn(e);
          toast(useSerial ? "बटन बॉक्स नहीं जुड़ पाया — Arduino Serial Monitor बंद करें" : "बटन बॉक्स नहीं जुड़ पाया — ESP32 चालू है? पास रखें और फिर कोशिश करें");
        }
      } finally { opening = false; }
    },
    /** Reconnect without a tap when the browser remembers the device. */
    async autoConnect() {
      startBoxChannel();
      if (hasNative) return startNative();
      if (link || opening) return;
      try {
        if (hasSerial) { const ports = await navigator.serial.getPorts(); if (ports[0]) return await openSerial(ports[0]); }
        if (hasBle && navigator.bluetooth.getDevices) {
          const devs = await navigator.bluetooth.getDevices();
          for (const d of devs) { try { return await openBle(d); } catch (e) {} }
        }
      } catch (e) { console.warn(e); }
    },
    led(uiState, force) {
      cloudLed(uiState);
      const v = LED_FOR[uiState] ? uiState : "idle"; if (!force && v === lastLed) return; lastLed = v; send("LED:" + v);
    },
    /** Box settings: save a new WiFi name/password on the box (it can be changed any time). */
    setWifi(ssid, pass) {
      ssid = String(ssid || "").trim(); pass = String(pass || "");
      if (!link) return toast("पहले बटन बॉक्स जोड़िए"), false;
      if (!ssid || /[\t\n]/.test(ssid + pass)) return toast("WiFi का नाम ठीक से लिखिए"), false;
      if (pass && pass.length < 8) return toast("WiFi पासवर्ड कम से कम 8 अक्षर का होता है"), false;
      send(`WIFI:${ssid}\t${pass}`); box.wifi = "CONNECTING " + ssid; BoxSettings.refresh();
      return true;
    },
    /** Box settings: show each state's pattern for a moment. */
    async testLeds() {
      if (!link) return toast("पहले बटन बॉक्स जोड़िए");
      for (const [st, spec] of Object.entries(CONFIG.ledPatterns || {})) {
        if (st === "idle") continue;
        toast("LED: " + st, 1400); send("LEDX:" + spec); await sleep(1600);
      }
      send("LEDX:off,000000,1000,0"); api.led(Buddy.state, true);
    },
    askWifi() { send("WIFI?"); },
    async forget() {
      if (!hasNative) return;
      try { await Native.call("boxForget"); toast("पुराना बॉक्स भूल गई — नया बॉक्स ढूँढ रही हूँ…"); } catch (e) {}
    },
    _onLine: onLine, _press: press, // for testing
  };

  // WiFi mode: write the state into devices.voice_led_state; a WiFi ESP32 sketch polls it.
  // Only the newest state is sent — if one write is in flight, the next waits for it.
  let cloudSent = null, cloudWant = "idle", cloudBusy = false;
  async function cloudLed(uiState) {
    const id = CONFIG.hardware && CONFIG.hardware.deviceId;
    if (!id || !SB) return;
    cloudWant = LED_FOR[uiState] ? uiState : "idle";
    if (cloudBusy || cloudWant === cloudSent) return;
    cloudBusy = true;
    try {
      while (cloudWant !== cloudSent) {
        const v = cloudWant;
        const { error } = await SB.from("devices").update({ voice_led_state: v, last_seen: new Date().toISOString(), online: true }).eq("id", id);
        if (error) { console.warn("LED state write failed", error.message); break; }
        cloudSent = v;
      }
    } finally { cloudBusy = false; }
  }
  addEventListener("pagehide", () => {           // tab closed: turn the LEDs off
    try { link && link.send("LED:OFF"); } catch (e) {}
    const id = CONFIG.hardware && CONFIG.hardware.deviceId; if (!id || !SB) return;
    try { fetch(`${CONFIG.supabase.url}/rest/v1/devices?id=eq.${id}`, { method: "PATCH", keepalive: true,
      headers: { apikey: CONFIG.supabase.anonKey, Authorization: "Bearer " + CONFIG.supabase.anonKey, "Content-Type": "application/json" },
      body: JSON.stringify({ voice_led_state: "idle", online: false }) }); } catch (e) {}
  });

  // Bluetooth-keyboard mode (older BLE keyboard sketch): F13 = activate, F20 = call log, F19 = cut call.
  // iPad browsers often report these keys only by keyCode, so all three forms are checked.
  const KEYS = { F13: "TALK", F20: "CALLS", F19: "HANGUP", 124: "TALK", 131: "CALLS", 130: "HANGUP" };
  const DEBUG_KEYS = QS.has("keys");            // add ?keys=1 to the URL to see every key the page receives
  addEventListener("keydown", (e) => {
    const k = String(e.key || "").replace(/^UIKeyInput/, "");
    if (DEBUG_KEYS) toast(`key="${e.key}" code="${e.code}" keyCode=${e.keyCode}`);
    const b = KEYS[k] || KEYS[e.code] || KEYS[e.keyCode];
    if (b && !e.repeat) { e.preventDefault(); e.stopPropagation(); press(b, true); }
  }, true);
  if (hasSerial) {
    navigator.serial.addEventListener("connect", (e) => { if (!link && !opening) openSerial(e.target).catch(() => {}); });
  }
  return api;
})();

/* =====================================================================
   BOX SETTINGS — long-press the "बटन बॉक्स" chip (or open with ?box=1):
   connection status, WiFi name/password for the box, LED test.
   ===================================================================== */
const BoxSettings = {
  isOpen() { return !!document.querySelector('[data-overlay="box"]'); },
  open() { this.render(); },
  wifiText(w) {
    if (!w) return ["—", ""];
    const [st, a, ...rest] = w.split(" ");
    if (st === "OK") return [`✓ जुड़ा है: ${rest.join(" ")}`, "ok"];
    if (st === "OFF") return ["सेट नहीं है", ""];
    if (st === "CONNECTING") return [`जुड़ रहा है: ${[a, ...rest].join(" ")}…`, ""];
    if (st === "FAIL") {
      const name = rest.join(" ");
      if (a === "wrong-password") return [`✗ पासवर्ड गलत है (${name})`, "bad"];
      if (a === "not-found") return [`✗ “${name}” नहीं मिला — 2.4 GHz WiFi चाहिए`, "bad"];
      return [`✗ नहीं जुड़ा (${a}) ${name}`, "bad"];
    }
    return [w, ""];
  },
  status() {
    const hw = Hardware, box = hw.box;
    const bt = hw.connected ? `✓ जुड़ा है${hw.kind === "native" ? "" : " (" + hw.kind + ")"}${box.fw ? " · v" + box.fw : ""}`
      : ({ searching: "ढूँढ रही हूँ… (बॉक्स चालू है?)", unauthorized: "✗ अनुमति नहीं: Settings → Chhaya → Bluetooth", "bluetooth-off": "✗ iPad का Bluetooth बंद है" }[box.native] || "जुड़ा नहीं है");
    const [wText, wCls] = this.wifiText(box.wifi);
    const cur = (box.wifi.match(/^(?:OK \S+|CONNECTING|FAIL \S+) (.+)$/) || [])[1] || "";
    return { bt, btCls: hw.connected ? "ok" : "bad", wText, wCls, cur };
  },
  /** Status changes only update the two status lines: redrawing the inputs would close the iPad keyboard. */
  refresh() {
    const o = document.querySelector('[data-overlay="box"]'); if (!o) return;
    const st = this.status();
    const b = o.querySelector("#boxBt"), w = o.querySelector("#boxWifi"), ssid = o.querySelector("#boxSsid");
    b.textContent = st.bt; b.className = st.btCls;
    w.textContent = st.wText; w.className = st.wCls;
    if (ssid && !ssid.value && document.activeElement !== ssid && st.cur) ssid.value = st.cur;
  },
  render() {
    const hw = Hardware, st = this.status();
    $("#overlay").innerHTML = `<div class="overlay" data-overlay="box"><div class="med-card boxset">
      <h2>बटन बॉक्स · Box settings</h2>
      <div class="st"><span>Bluetooth</span><b id="boxBt" class="${st.btCls}">${esc(st.bt)}</b></div>
      <div class="st"><span>WiFi (बैकअप)</span><b id="boxWifi" class="${st.wCls}">${esc(st.wText)}</b></div>
      <label for="boxSsid">WiFi का नाम</label>
      <input id="boxSsid" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" value="${esc(st.cur)}">
      <label for="boxPass">WiFi पासवर्ड</label>
      <div class="pw"><input id="boxPass" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" value=""><button class="tap" data-act="boxPwToggle">🙈</button></div>
      <div class="row" style="margin-top:14px"><button class="yes tap" data-act="boxSave">WiFi सेव करें</button></div>
      <div class="note">बॉक्स इसे सेव कर लेता है; जब चाहें बदल सकते हैं। सिर्फ़ 2.4 GHz WiFi चलता है।</div>
      <div class="row">
        <button class="no tap" data-act="boxTest">LED टेस्ट</button>
        ${hw.hasNative ? '<button class="no tap" data-act="boxForget">दूसरा बॉक्स</button>' : ""}
        <button class="no tap" data-act="diagToggle">${store.get("diag", false) ? "Diagnostics बंद" : "Diagnostics"}</button>
        <button class="no tap" data-act="closeOverlay">बंद करें</button>
      </div>
    </div></div>`;
    if (hw.connected) hw.askWifi();
    // Keep the form inside the part of the screen the keyboard leaves free.
    const o = document.querySelector('[data-overlay="box"]'), vv = window.visualViewport;
    if (vv && o) {
      const fit = () => { if (!document.body.contains(o)) return vv.removeEventListener("resize", fit); o.style.height = vv.height + "px"; o.style.top = vv.offsetTop + "px"; o.style.bottom = "auto"; };
      vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit); fit();
    }
    o && o.addEventListener("focusin", (e) => { if (e.target.matches("input")) setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 350); });
    o && o.querySelector("#boxSsid").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); o.querySelector("#boxPass").focus(); } });
    o && o.querySelector("#boxPass").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); o.querySelector('[data-act="boxSave"]').click(); } });
  },
};

/* =====================================================================
   CHECK-IN — when it's been quiet for a while (daytime only), Chhaya starts a
   friendly chat on her own ("आज आपका दिन कैसा रहा?") and then listens for the
   answer, so they can just reply without saying "छाया".
   ===================================================================== */
const CheckIn = {
  last: 0,
  start() {
    const c = CONFIG.checkin; if (!c || !c.enabled) return;
    try { this.last = +store.get("checkinAt", 0) || 0; } catch (e) {}
    setInterval(() => this.maybe(), 60 * 1000);
  },
  async maybe() {
    const c = CONFIG.checkin, now = Date.now(), h = new Date().getHours();
    if (!state.started || !SB || Assistant.busy || Calls.inCall() || Calls.incomingCall || Music.playing || document.hidden) return;
    if (h < c.fromHour || h >= c.toHour) return;
    if (now - (state.lastTalk || state.startedAt || now) < c.quietMin * 60000) return;
    if (now - this.last < c.everyMin * 60000) return;
    this.last = now; store.set("checkinAt", now);
    await Assistant.exclusive(async () => {
      Buddy.hop();
      const r = await API.voice({ mode: "proactive", trigger: { type: "day_checkin" } });
      if (Assistant.cancelled || !r.audioBase64) return;
      if (r.language) setLang(r.language);
      await Voice.say(r.audioBase64, r.audioMime, r.reply);
      state.history.push({ user: "", assistant: r.reply || "" });
      await Assistant.listenAndAsk(3);
    });
  },
};

/* =====================================================================
   START — one tap unlocks microphone + sound (browsers require it).
   ===================================================================== */
const Start = {
  show() {
    $("#overlay").innerHTML = `<div class="overlay" data-overlay="start"><div class="start-card">
      <img src="${CONFIG.images.avatar}" alt=""><h2>नमस्ते! मैं छाया हूँ</h2>
      <p>शुरू करने के लिए नीचे का बटन दबाइए। उसके बाद बस “छाया” बोलिए।</p>
      <button class="bigbtn tap" data-act="start">शुरू करें</button>
      ${Hardware.supported && !Hardware.connected ? '<button class="hwbtn tap" data-act="hwConnect">🔌 बटन बॉक्स जोड़ें</button>' : ""}</div></div>`;
  },
  async begin() {
    if (state.started) return;
    state.started = true;
    const o = document.querySelector('[data-overlay="start"]'); if (o) o.remove();
    Voice.ensure(); try { await Voice.ctx.resume(); } catch (e) {}
    try { await Mic.init(); } catch (e) { toast("माइक की अनुमति नहीं मिली"); }
    // In the app: ask for the camera once, on this setup tap, so the permission popup never
    // interrupts Sarla's first video call or photo.
    if (Native.available && !store.get("camAsked", false) && navigator.mediaDevices) {
      store.set("camAsked", true);
      navigator.mediaDevices.getUserMedia({ video: true }).then((s) => s.getTracks().forEach((t) => t.stop()))
        .catch((e) => Diag.add("camera permission: " + e.name));
    }
    state.startedAt = Date.now();
    Wake.start(); Realtime.start(); Medicine.start(); Reminders.start(); Health.start();
    Ack.load("hi"); Ack.load("mr"); CheckIn.start();
    render();
  },
};

/* =====================================================================
   HEALTH — keeps Chhaya responsive for days without a reload:
   • every 3 s: if nothing is happening, make sure she's listening for "छाया"
   • a turn stuck for too long is dropped (buttons and wake word never die)
   • keeps the iPad screen awake (a sleeping screen kills the microphone)
   • when the tablet wakes up: fresh microphone + sound, listening again
   Add ?debug=1 to the URL to see a small status line.
   ===================================================================== */
const Health = {
  lock: null, busySince: 0,
  start() {
    this.keepAwake();
    setInterval(() => this.check(), 3000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) this.revive(); });
    addEventListener("pageshow", () => this.revive());
    addEventListener("focus", () => this.revive());
    if (QS.has("debug") || store.get("diag", false)) {
      const d = document.createElement("div"); d.id = "dbg";
      d.style.cssText = "position:fixed;left:6px;bottom:6px;z-index:55;font:11px/1.35 monospace;background:#000c;color:#0f0;padding:4px 8px;border-radius:6px;max-width:70vw;max-height:34vh;overflow:hidden;white-space:pre-wrap";   // under popups (z 60)
      const bar = document.createElement("div"); bar.style.cssText = "display:flex;gap:8px;margin-bottom:4px";
      bar.innerHTML = '<button data-dbg="play" style="background:#0f0;color:#000;border-radius:6px;padding:4px 10px;font:bold 13px sans-serif">▶ play last clip</button><button data-dbg="hide" style="background:#444;color:#fff;border-radius:6px;padding:4px 10px;font:13px sans-serif">hide</button>';
      const txt = document.createElement("div");
      d.append(bar, txt);
      d.addEventListener("click", (e) => {
        e.stopPropagation();
        const b = e.target.closest("[data-dbg]"); if (!b) return;
        if (b.dataset.dbg === "hide") { d.style.display = "none"; return; }
        if (!Mic.lastClip) { Diag.add("no clip recorded yet"); return; }
        const a = new Audio(URL.createObjectURL(Mic.lastClip)); a.volume = 1;
        a.onloadedmetadata = () => Diag.add(`playing clip, ${isFinite(a.duration) ? a.duration.toFixed(1) + "s" : "unknown length"}`);
        a.onerror = () => Diag.add("clip can't be played: " + ((a.error && a.error.code) || "?"));
        a.play().catch((err) => Diag.add("play failed " + err.message));
      });
      document.body.appendChild(d);
      setInterval(() => {
        txt.textContent = `v30.3${Native.available ? " app" : ""} ${location.protocol} busy:${Assistant.busy} state:${Buddy.state} mic:${Mic.alive()} audio:${Voice.ctx && Voice.ctx.state} ` +
          `level:${(Mic.level || 0).toFixed(3)} noise:${Mic.noise.toFixed(3)} hw:${Hardware.connected ? "on" : "off"}${Hardware.hasNative ? "/" + Hardware.box.native : ""}\nwake:${JSON.stringify(Wake.debug)}\n` + Diag.lines.join("\n");
      }, 500);
    }
  },
  async keepAwake() {
    try { if ("wakeLock" in navigator && !document.hidden) { this.lock = await navigator.wakeLock.request("screen"); this.lock.addEventListener("release", () => { this.lock = null; }); } } catch (e) {}
  },
  async revive() {
    if (!state.started) return;
    Voice.wake();
    if (!this.lock) this.keepAwake();
    if (!Mic.alive()) { try { await Mic.init(); } catch (e) {} }
    if (!Assistant.busy) Wake.reset();
  },
  check() {
    if (!state.started) return;
    Voice.wake();
    // A turn that has been running far too long (network or audio hung): free her.
    if (Assistant.busy) { if (!this.busySince) this.busySince = Date.now(); else if (Date.now() - this.busySince > 150000) { Assistant.forceFree(); this.busySince = 0; } }
    else this.busySince = 0;
    // Buddy stuck showing "speaking"/"listening" while nothing is running.
    if (!Assistant.busy && !Voice.streaming && !Voice.playing && Buddy.state !== "idle" && !Calls.inCall() && !Calls.incomingCall) { if ((this.oddSince = this.oddSince || Date.now()) && Date.now() - this.oddSince > 8000) { Buddy.setState("idle"); this.oddSince = 0; } }
    else this.oddSince = 0;
    if (!Mic.alive() && !Assistant.busy && !document.hidden) Mic.init().catch(() => {});
    Wake.heal();
  },
};

/* ====================== events ====================== */
document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]");
  if (act) {
    e.stopPropagation();
    const id = act.dataset.id;
    switch (act.dataset.act) {
      case "start": {
        // Button box used before and the browser can't reconnect on its own (e.g. Bluefy): ask once here.
        let prev = ""; try { prev = localStorage.getItem("chhaya.hw") || ""; } catch (e) {}
        if (prev === "ble" && Hardware.hasBle && !Hardware.connected) Hardware.connect();
        Start.begin(); break;
      }
      case "hwConnect": if (hwLongPressed) { hwLongPressed = false; break; } Hardware.connect(); break;
      case "boxSave": {
        const ok = Hardware.setWifi($("#boxSsid").value, $("#boxPass").value);
        if (ok) { $("#boxPass").value = ""; toast("WiFi बॉक्स को भेज दिया — जुड़ने में 10–20 सेकंड लगते हैं"); }
        break;
      }
      case "boxPwToggle": { const i = $("#boxPass"); const hide = i.type !== "password"; i.type = hide ? "password" : "text"; act.textContent = hide ? "👁" : "🙈"; break; }
      case "boxTest": Hardware.testLeds(); break;
      case "boxForget": Hardware.forget(); break;
      case "diagToggle": store.set("diag", !store.get("diag", false)); location.reload(); break;
      case "callBack": Calls.startFromContact(id); break;
      case "back": back(); break;
      case "likeMem": state.memLiked = !state.memLiked; store.set("memLiked", state.memLiked); act.innerHTML = I.heart(state.memLiked); break;
      case "speakMed": {
        const m = nextMedicine();
        if (!SB) { toast("अगली दवा शाम 6 बजे"); break; }
        Assistant.exclusive(async () => { Buddy.hop(); await Assistant.ask({ text: m ? `मेरी अगली दवा "${m.label}" कब है?` : "क्या आज मेरी कोई दवा बाकी है?" }); });
        break;
      }
      case "more": state.showAllMemories = true; render(); break;
      case "check": {
        const r = state.reminders.find((x) => x.id === id); if (!r) break;
        r.status = r.status === "done" ? "pending" : "done";
        act.querySelector(".chk").classList.toggle("on", r.status === "done"); act.classList.toggle("done", r.status === "done");
        if (SB) SB.from("reminders").update({ status: r.status }).eq("id", id).then(() => {});
        break;
      }
      case "checkRoutine": {
        const x = state.schedule.find((y) => y.id === id); if (!x) break;
        x.done = !x.done;
        act.classList.toggle("done", x.done); act.querySelector(".chk").classList.toggle("on", x.done);
        if (SB) SB.from("schedule_items").update({ done: x.done }).eq("id", id).then(({ error }) => { if (error) console.warn("[Chhaya] routine tick didn't save:", error); });
        break;
      }
      case "callContact": Calls.startFromContact(id); break;
      case "hangup": Calls.end(true); break;
      case "accept": Calls.accept(); break;
      case "decline": Calls.decline(); break;
      case "toggle": Music.current ? Music.toggle() : Music.step(1); break;
      case "prev": Music.prev(); break;
      case "next": Music.next(); break;
      case "ytToggle": Music.toggle(); break;
      case "ytClose": Music.stop(); break;
      case "playSong": {
        const p = playlists().find((x) => x.id === act.dataset.p); const s = p?.songs[+act.dataset.i]; if (!s) break;
        if (Music.current && (Music.current.videoId === s.videoId && s.videoId)) Music.toggle();
        else s.videoId ? Music.play(s) : Music.playByTitle(s.title);
        break;
      }
      case "shoot": Camera.countdownShot(3); break;
      case "medYes": Medicine.answerByTap(id, true); break;
      case "remDone": Reminders.done(id); break;
      case "remSnooze": Reminders.snooze(id); break;
      case "medNo": Medicine.answerByTap(id, false); break;
      case "likePhoto": if (SB) SB.from("photos").update({ liked: true }).eq("id", id).then(() => {}); act.innerHTML = I.heart(true, 26) + " पसंद है"; break;
      case "closeOverlay": { const o = act.closest(".overlay"); if (o) o.remove(); break; }
    }
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g) go(g.dataset.go);
  else if (!state.started && document.querySelector('[data-overlay="start"]')) Start.begin();
});

/* Long-press the button box chip -> Box settings (a plain tap just connects). */
let hwLongPressed = false, hwPressTimer = null;
document.addEventListener("pointerdown", (e) => {
  if (!e.target.closest('[data-act="hwConnect"]')) return;
  hwLongPressed = false; clearTimeout(hwPressTimer);
  hwPressTimer = setTimeout(() => { hwLongPressed = true; BoxSettings.open(); }, 700);
});
["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, () => clearTimeout(hwPressTimer)));

/* ====================== boot ====================== */
render();
Start.show();
Hardware.autoConnect();
// iPadOS keeps the page's audio engine (which also measures the voice level for "छाया")
// off until the screen is touched, so Chhaya still starts with one tap on "शुरू करें".
if (Native.available) {
  Native.start();
  Native.on("micLevel", (d) => { const l = (d && d.level) || 0; Mic.level = l; const b = document.getElementById("buddy"); if (b) b.style.setProperty("--lvl", l.toFixed(3)); });
}
// Any touch re-enables sound + listening if the iPad paused them (sleep, a call, Control Centre).
document.addEventListener("pointerdown", () => { if (state.started) Voice.wake(); }, true);
if (QS.has("box")) setTimeout(() => BoxSettings.open(), 1200);

/* Keep the voice server warm so the first answer after a quiet spell is quick
   (a cold server adds 1–2 s). A tiny request with no audio, every 4 minutes. */
const warmVoice = () => { if (!document.hidden) API.voice({ mode: "wake_check" }).catch(() => {}); };
setTimeout(warmVoice, 1500);
setInterval(warmVoice, 4 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) warmVoice(); });
Data.loadAll().catch((e) => console.warn("offline mode", e));
</script>
</body>
</html>
