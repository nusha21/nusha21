<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breethr</title>
<meta name="description" content="Play the Breethr panel animation.">
<meta name="theme-color" content="#FDFAF7">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --warm-white: #FDFAF7;
    --beige: #F9F5EE;
    --sky: #D0F1F8;
    --blues: #5497A7;
    --ink: #073D4D;
    --warm-black: #141414;
    --burnt: #CE722B;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 70% at 50% 0%, var(--sky) 0%, rgba(208, 241, 248, 0) 60%),
      var(--warm-white);
    color: var(--warm-black);
    font-family: "Hanken Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: max(40px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .brand .logo { width: 40px; height: auto; display: block; }
  .brand span {
    font-size: 15px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink);
  }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 36px; }

  .play {
    position: relative;
    width: min(56vw, 220px);
    aspect-ratio: 1;
    border: 0;
    border-radius: 50%;
    background: var(--ink);
    color: var(--warm-white);
    font: inherit;
    font-size: clamp(20px, 5vw, 24px);
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 18px 40px -18px rgba(7, 61, 77, 0.55);
    transition: transform 160ms ease, box-shadow 160ms ease, background-color 200ms ease;
    isolation: isolate;
  }
  .play:hover { box-shadow: 0 22px 46px -18px rgba(7, 61, 77, 0.65); }
  .play:active { transform: scale(0.97); }
  .play:focus-visible { outline: 3px solid var(--blues); outline-offset: 6px; }
  .play:disabled { cursor: default; }
  .play .label { position: relative; z-index: 1; }

  /* Soft rings that spread out when PLAY is pressed. */
  .play::before, .play::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--blues);
    opacity: 0;
    z-index: -1;
    pointer-events: none;
  }
  .play.sent::before { animation: ring 1.6s ease-out; }
  .play.sent::after { animation: ring 1.6s ease-out 0.35s; }
  @keyframes ring {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  .status {
    min-height: 3em;
    max-width: 340px;
    overflow-wrap: anywhere;
    margin: 0;
    text-align: center;
    font-size: 16px;
    line-height: 1.5;
    color: #4a5a5f;
  }
  .status.error { color: #9a4a12; }

  footer { font-size: 13px; color: #8a9396; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    .play, .play.sent::before, .play.sent::after { transition: none; animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg class="logo" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 728" fill="#073D4D" aria-label="Breethr"><g transform="translate(0,728) scale(0.1,-0.1)"><path d="M1420 7269 c-178 -15 -339 -71 -490 -170 -488 -320 -798 -1057 -895 -2129 -19 -206 -31 -749 -20 -904 l7 -109 69 133 c227 437 620 877 1114 1251 621 470 1358 779 1857 779 364 0 644 -184 738 -485 31 -99 31 -257 0 -380 -83 -331 -304 -681 -644 -1021 -134 -133 -299 -278 -333 -291 -6 -3 -51 18 -98 47 -333 196 -692 330 -1051 392 -170 29 -524 32 -676 5 -381 -67 -602 -237 -680 -526 -28 -101 -30 -315 -5 -411 81 -305 315 -485 712 -547 137 -21 423 -21 584 1 390 53 777 192 1157 416 l52 30 83 -67 c110 -88 321 -295 419 -408 388 -452 559 -892 474 -1219 -60 -229 -254 -412 -514 -483 -101 -28 -380 -25 -519 6 -940 203 -2219 1184 -2691 2063 l-48 90 -7 -97 c-10 -128 0 -756 14 -910 119 -1299 551 -2109 1215 -2279 257 -67 510 -36 712 85 176 106 356 320 465 554 20 41 36 64 44 61 35 -13 252 -56 337 -67 142 -17 438 -7 553 20 373 84 639 272 794 562 193 358 170 834 -63 1324 -170 356 -470 736 -784 989 -40 33 -71 62 -70 66 2 4 47 47 102 95 820 729 1151 1583 857 2211 -123 262 -347 468 -624 572 -174 65 -246 76 -492 76 -229 1 -329 -11 -535 -64 -41 -10 -76 -17 -78 -15 -3 2 -19 41 -38 86 -61 150 -187 328 -305 430 -218 191 -423 260 -699 238z m284 -443 c108 -53 221 -177 296 -326 25 -49 29 -65 19 -69 -35 -11 -386 -195 -489 -256 -341 -203 -634 -426 -867 -663 -59 -59 -103 -97 -103 -88 0 28 39 195 77 326 90 317 221 601 359 782 109 141 257 258 377 297 93 30 95 30 188 27 71 -2 96 -7 143 -30z m-88 -2925 c201 -37 417 -107 636 -207 48 -21 86 -43 85 -49 -5 -14 -278 -129 -417 -174 -376 -125 -793 -139 -1005 -34 -117 58 -168 149 -145 259 25 119 150 198 358 224 108 14 363 4 488 -19z m-772 -2260 c274 -235 600 -448 969 -634 97 -49 177 -93 177 -98 0 -6 -12 -33 -26 -62 -102 -201 -261 -339 -409 -353 -125 -12 -292 46 -415 145 -242 194 -451 596 -574 1104 -58 239 -65 228 60 102 60 -61 158 -153 218 -204z"/></g></svg>
    <span>Breethr</span>
  </div>

  <div class="stage">
    <button class="play" id="play" type="button" aria-describedby="status">
      <span class="label">Play</span>
    </button>
    <p class="status" id="status" role="status" aria-live="polite">Press play to start the panel animation.</p>
  </div>

  <footer>Breethr panel</footer>
</main>

<script>
  // On Vercel the page talks to its own /api/play. Opened as a downloaded
  // file, it uses this address instead: put your Vercel address here.
  const VERCEL_URL = 'https://breethr-play.vercel.app';
  const API_URL = (location.protocol === 'file:' ? VERCEL_URL : '') + '/api/play';

  const button = document.getElementById('play');
  const status = document.getElementById('status');
  const IDLE_TEXT = 'Press play to start the panel animation.';
  let resetTimer;

  function show(text, isError) {
    status.textContent = text;
    status.classList.toggle('error', Boolean(isError));
  }

  button.addEventListener('click', async () => {
    clearTimeout(resetTimer);
    button.disabled = true;
    button.classList.remove('sent');
    show('Sending…');
    try {
      let res;
      try {
        res = await fetch(API_URL, { method: 'POST', cache: 'no-store' });
      } catch (networkError) {
        throw new Error(location.protocol === 'file:'
          ? 'Could not reach ' + VERCEL_URL + '. Set VERCEL_URL in this file to your Vercel address.'
          : 'Could not reach the PLAY service. Check your internet connection.');
      }
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        if (res.status === 404) {
          throw new Error('PLAY service not found at ' + API_URL + ' (404). In Vercel, set Root Directory to breethr_play_web and redeploy.');
        }
        throw new Error((body.error || 'PLAY service error') + ' (' + res.status + ')');
      }
      void button.offsetWidth; // restart the ring animation
      button.classList.add('sent');
      show('Sent. The panel starts playing within a few seconds.');
      resetTimer = setTimeout(() => show(IDLE_TEXT), 8000);
    } catch (err) {
      show(err.message, true);
      console.error(err);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
